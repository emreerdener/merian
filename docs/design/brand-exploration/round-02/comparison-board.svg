<text x="1072" y="777" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#555">REVERSED</text>
<image x="1246" y="675.0" width="64" height="64" href="data:image/png;base64,"/>
<text x="1246" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">64 px</text>
<image x="1344" y="691.0" width="32" height="32" href="data:image/png;base64,"/>
<text x="1344" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">32 px</text>
<image x="1442" y="699.0" width="16" height="16" href="data:image/png;base64,"/>
<text x="1442" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">16 px</text>
<text x="1072" y="830" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333">A cocked tail and curved wing opening</text><text x="1072" y="857" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333">give a small bird an attentive character.</text>
<text x="1072" y="921" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333">Warmest, most characterful alternative.</text><text x="1072" y="948" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333">Risk: could suggest a bird-only app.</text>
<path d="M64 1007H1536" stroke="#222"/>
<text x="64" y="1046" font-family="Georgia,serif" font-size="22" font-weight="400" fill="#000">A is the strongest direction to develop; C offers the most personality.</text>
<text x="64" y="1080" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#555">Concept studies only. Black and white. No production assets changed.</text>
