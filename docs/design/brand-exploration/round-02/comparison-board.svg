<text x="64" y="777" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#555">REVERSED</text>
<image x="238" y="675.0" width="64" height="64" href="data:image/png;base64,"/>
<text x="238" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">64 px</text>
<image x="336" y="691.0" width="32" height="32" href="data:image/png;base64,"/>
<text x="336" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">32 px*</text>
<image x="434" y="699.0" width="16" height="16" href="data:image/png;base64,"/>
<text x="434" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">16 px*</text>
<text x="64" y="830" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333">The N grows into a fern frond:</text><text x="64" y="857" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333">a coiled tip and two broad leaflets.</text>
<text x="64" y="921" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333">Strongest link between name and nature.</text><text x="64" y="948" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333">Risk: can feel ornamental or plant-specific.</text>
<text x="64" y="977" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#666">* Simplified rolled tip at 16–32 px.</text>
<path d="M544 220V989" stroke="#ddd"/>
<text x="568" y="240" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#000">B / Fieldwing</text>
<g transform="translate(623 279) scale(1.3)"><path fill="#000000" fill-rule="evenodd" d="M128 68C121 68 116 76 116 86V98C91 71 60 49 31 41Q28 40 27 43C24 58 28 79 35 98C44 119 57 130 75 140C56 143 44 157 48 174C53 198 79 211 112 195C116 205 121 216 128 220C135 216 140 205 144 195C177 211 203 198 208 174C212 157 200 143 181 140C199 130 212 119 221 98C228 79 232 58 229 43Q228 40 225 41C196 49 165 71 140 98V86C140 76 135 68 128 68Z M54 72C75 79 95 94 108 115C84 113 64 98 54 72Z M202 72C181 79 161 94 148 115C172 113 192 98 202 72Z"/></g>
