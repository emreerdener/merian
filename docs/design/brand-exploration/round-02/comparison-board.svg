<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110"><rect width="1600" height="1110" fill="white"/>
<text x="64" y="51" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#555">NATUREBOOK / ROUND 02</text>
<text x="1287" y="51" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#555">07 NOVEMBER 2026</text>
<text x="64" y="116" font-family="Georgia,serif" font-size="49" font-weight="400" fill="#000">Nature in the silhouette.</text>
<text x="64" y="160" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#444">An unfurling fern, an insect in flight, and an inquisitive bird. Three recognizably living forms.</text>
<path d="M64 190H1536" stroke="#222"/>
<text x="64" y="240" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#000">A / Fiddlehead N</text>
