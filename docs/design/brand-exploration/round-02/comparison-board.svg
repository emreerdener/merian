<text x="568" y="777" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#555">REVERSED</text>
<image x="742" y="675.0" width="64" height="64" href="data:image/png;base64,"/>
<text x="742" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">64 px</text>
<image x="840" y="691.0" width="32" height="32" href="data:image/png;base64,"/>
<text x="840" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">32 px</text>
<image x="938" y="699.0" width="16" height="16" href="data:image/png;base64,"/>
<text x="938" y="777" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555">16 px</text>
<text x="568" y="830" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333">Sweeping forewings and carved openings</text><text x="568" y="857" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333">create a compact insect silhouette.</text>
<text x="568" y="921" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333">Immediate nature cue; balanced and bold.</text><text x="568" y="948" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333">Risk: familiar butterfly territory.</text>
<path d="M1048 220V989" stroke="#ddd"/>
<text x="1072" y="240" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#000">C / Curious wren</text>
<g transform="translate(1127 279) scale(1.3)"><path fill="#000000" fill-rule="evenodd" d="M 53 194 C 57 175 56 153 51 137 C 35 115 28 84 32 53 C 53 74 74 94 94 106 C 110 92 129 85 147 86 C 150 60 180 55 200 71 C 214 82 216 99 208 115 L 228 135 L 201 131 C 191 164 164 188 129 195 C 100 201 77 200 53 194 Z M 86 137 C 107 114 140 110 167 121 C 139 131 121 150 112 173 C 97 167 88 154 86 137 Z M 187 89 A 7 7 0 1 0 187 103 A 7 7 0 1 0 187 89 Z"/></g>
