<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
<rect width="1600" height="1240" fill="#ffffff"/>
<text x="64" y="55" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#555555">NATUREBOOK / SYMBOL STUDIES</text>
<text x="1270" y="55" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#555555">06 NOVEMBER 2026</text>
<text x="64" y="122" font-family="Georgia,serif" font-size="52" font-weight="400" fill="#000000">A life of noticing.</text>
<text x="64" y="165" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#444444">Three directions for curiosity, personal discovery, and a lasting connection with nature.</text>
<path d="M64 197H1536" stroke="#222222"/>
<text x="64" y="245" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#000000">A / Living N</text>
<text x="64" y="276" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#666666">LETTERFORM</text>
<rect x="365" y="224" width="151" height="27" rx="13.5" fill="black"/>
<text x="382" y="242" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="white">RECOMMENDED</text>
<g transform="translate(133 310) scale(1.25)"><path fill="#000000" d="M44 216.7Q42 217 42 215V84C42 57 53 43 72 43C94 43 109 67 124 94C139 120 152 140 166 148Q170 150 170 146V84C170 58 183 44 212 39.3Q214 39 214 41V172C214 199 203 213 184 213C162 213 147 189 132 162C117 136 104 116 90 108Q86 106 86 110V172C86 198 73 212 44 216.7Z"/></g>
<rect x="64" y="656" width="112" height="112" rx="25" fill="#000000"/>
