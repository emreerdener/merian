<text x="64" y="791" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#555555">REVERSED / TILE STUDY</text>
<image x="238" y="696.0" width="64" height="64" href="data:image/png;base64,"/>
<text x="238" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">64 px</text>
<image x="336" y="712.0" width="32" height="32" href="data:image/png;base64,"/>
<text x="336" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">32 px</text>
<image x="434" y="720.0" width="16" height="16" href="data:image/png;base64,"/>
<text x="434" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">16 px</text>
<text x="64" y="839" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333333">A continuous N with a flowing diagonal</text>
<text x="64" y="866" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333333">and two gently tapered terminals.</text>
<text x="64" y="914" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#555555">STRENGTH</text>
<text x="64" y="942" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Direct connection to the name.</text>
<text x="64" y="969" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Distinctive silhouette; strongest at 16 px.</text>
<text x="64" y="1014" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#555555">TRADEOFF</text>
<text x="64" y="1042" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Nature is suggested through form,</text>
<text x="64" y="1069" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">rather than a literal natural subject.</text>
<path d="M544 226V1065" stroke="#dedede"/>
<text x="568" y="245" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#000000">B / Fieldfold</text>
<text x="568" y="276" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#666666">PICTORIAL ABSTRACTION</text>
<g transform="translate(637 310) scale(1.25)"><path fill="#000000" d="M39 60C74 61 103 78 115 105V207Q115 211 112 208C91 189 66 178 39 178Q35 178 36 174C47 142 47 103 36 64Q35 60 39 60Z M141 105C157 78 184 56 216 44Q220 42 219 46C208 80 204 121 210 156Q211 159 208 160C183 172 160 189 144 208Q141 211 141 207Z"/></g>
<rect x="568" y="656" width="112" height="112" rx="25" fill="#000000"/>
<g transform="translate(568 656) scale(.4375)"><path fill="#ffffff" d="M39 60C74 61 103 78 115 105V207Q115 211 112 208C91 189 66 178 39 178Q35 178 36 174C47 142 47 103 36 64Q35 60 39 60Z M141 105C157 78 184 56 216 44Q220 42 219 46C208 80 204 121 210 156Q211 159 208 160C183 172 160 189 144 208Q141 211 141 207Z"/></g>
<text x="568" y="791" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#555555">REVERSED / TILE STUDY</text>
<image x="742" y="696.0" width="64" height="64" href="data:image/png;base64,"/>
<text x="742" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">64 px</text>
<image x="840" y="712.0" width="32" height="32" href="data:image/png;base64,"/>
<text x="840" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">32 px</text>
<image x="938" y="720.0" width="16" height="16" href="data:image/png;base64,"/>
<text x="938" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">16 px</text>
<text x="568" y="839" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333333">An open fieldbook with pages that bend</text>
<text x="568" y="866" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333333">as if caught by a passing breeze.</text>
<text x="568" y="914" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#555555">STRENGTH</text>
<text x="568" y="942" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Connects discovery with keeping a record.</text>
<text x="568" y="969" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Warm, editorial, and easy to understand.</text>
<text x="568" y="1014" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#555555">TRADEOFF</text>
<text x="568" y="1042" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Book marks are a crowded territory;</text>
<text x="568" y="1069" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">may suggest reading before exploring.</text>
<path d="M1048 226V1065" stroke="#dedede"/>
<text x="1072" y="245" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#000000">C / Clearing</text>
<text x="1072" y="276" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#666666">ABSTRACT SYMBOL</text>
<g transform="translate(1141 310) scale(1.25)"><path fill="#000000" fill-rule="evenodd" d="M121 37C158 29 195 43 210 75C226 109 217 149 190 181C164 212 124 224 88 212C53 201 34 173 37 139C40 100 79 46 121 37Z M128 86C146 79 163 88 166 106C169 124 158 136 147 151C135 168 124 176 109 170C92 163 88 149 94 132C100 114 111 93 128 86Z"/></g>
<rect x="1072" y="656" width="112" height="112" rx="25" fill="#000000"/>
<g transform="translate(1072 656) scale(.4375)"><path fill="#ffffff" fill-rule="evenodd" d="M121 37C158 29 195 43 210 75C226 109 217 149 190 181C164 212 124 224 88 212C53 201 34 173 37 139C40 100 79 46 121 37Z M128 86C146 79 163 88 166 106C169 124 158 136 147 151C135 168 124 176 109 170C92 163 88 149 94 132C100 114 111 93 128 86Z"/></g>
<text x="1072" y="791" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#555555">REVERSED / TILE STUDY</text>
<image x="1246" y="696.0" width="64" height="64" href="data:image/png;base64,"/>
<text x="1246" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">64 px</text>
<image x="1344" y="712.0" width="32" height="32" href="data:image/png;base64,"/>
<text x="1344" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">32 px</text>
<image x="1442" y="720.0" width="16" height="16" href="data:image/png;base64,"/>
<text x="1442" y="791" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">16 px</text>
<text x="1072" y="839" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333333">A river-worn opening in a smooth stone:</text>
<text x="1072" y="866" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#333333">a small invitation to look more closely.</text>
<text x="1072" y="914" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#555555">STRENGTH</text>
<text x="1072" y="942" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Tactile, quiet, and independent of language.</text>
<text x="1072" y="969" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">Leaves room for every kind of encounter.</text>
<text x="1072" y="1014" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#555555">TRADEOFF</text>
<text x="1072" y="1042" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">May read as an O or a wellness symbol;</text>
<text x="1072" y="1069" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#333333">needs more brand association to be owned.</text>
<path d="M64 1106H1536" stroke="#222222"/>
<text x="64" y="1148" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#000000">Start with A — Living N.</text>
<text x="64" y="1185" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#444444">The clearest name connection, with enough organic character to grow into a broader identity.</text>
<text x="1300" y="1185" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#555555">EXPLORATION / 01</text>
</svg>