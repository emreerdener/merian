disabled_rules:
  - trailing_whitespace
  - line_length
  - function_body_length
  - cyclomatic_complexity
  - type_body_length
  - force_cast
  - force_try
  - file_length
  - identifier_name

opt_in_rules:
  - empty_count
  - explicit_init
  - redundant_nil_coalescing
  - sorted_imports

included:
  - merian

excluded:
  - Pods
  - fastlane
  - supabase
  - docs
  - .agents

analyzer_rules:
  - explicit_self

custom_rules:
  no_magic_numbers:
    name: "Magic Number"
    regex: "(?<!\\w)(?:0x[a-fA-F0-9]+|[0-9]+\\.[0-9]+|[0-9]+)(?!\\w)(?!\\s*(?:times|seconds|minutes|hours|days|weeks|months|years|ms))"
    message: "Magic numbers should be avoided. Define a constant locally or globally."
    severity: warning
