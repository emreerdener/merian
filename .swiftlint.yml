disabled_rules:
  - trailing_whitespace
  - line_length
  - function_body_length
  - cyclomatic_complexity
  - type_body_length
  - force_cast
  - force_try
  - file_length
  - identifier_name
  - multiple_closures_with_trailing_closure
  - function_parameter_count

opt_in_rules:
  - empty_count
  - explicit_init
  - redundant_nil_coalescing
  - sorted_imports

included:
  - merian

excluded:
  - Pods
  - fastlane
  - supabase
  - docs
  - .agents

analyzer_rules:
  - explicit_self

