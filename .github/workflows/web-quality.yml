name: Naturebook Web Quality

on:
  pull_request:
    paths:
      - ".github/workflows/web-quality.yml"
      - "apps/web/**"
      - "apps/ios/Merian/Configuration/Info.plist"
      - "apps/ios/Merian/Features/Onboarding/Steps/LocationPermission/LocationPermissionStepView.swift"
      - "apps/ios/Merian/Features/Profile/Settings/Views/DeleteAccountSheet.swift"
      - "services/supabase/migrations/20260724192124_harden_json_endpoints_and_waitlist.sql"
      - "services/supabase/tests/waitlist_security.sql"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-quality.yml"
      - "apps/web/**"
      - "apps/ios/Merian/Configuration/Info.plist"
      - "apps/ios/Merian/Features/Onboarding/Steps/LocationPermission/LocationPermissionStepView.swift"
      - "apps/ios/Merian/Features/Profile/Settings/Views/DeleteAccountSheet.swift"
      - "services/supabase/migrations/20260724192124_harden_json_endpoints_and_waitlist.sql"
      - "services/supabase/tests/waitlist_security.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naturebook-web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SITE_URL: https://naturebook.earth
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build production web app
        run: npm run build
