name: Import Community Taxonomy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Taxonomy target to import.
        required: true
        default: birds
        type: choice
        options:
          - birds
      limit:
        description: Rows per GBIF page.
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "200"
      page_count:
        description: Number of pages to import in this run.
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      dry_run:
        description: Fetch and validate without writing taxonomy rows.
        required: true
        default: true
        type: boolean
      retry:
        description: Replay the last failed or most recent page when no offset is provided.
        required: true
        default: false
        type: boolean

concurrency:
  group: community-taxonomy-import-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: Production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: qlarqavoqhkuwzmevrmf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Validate import secrets
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"

      - name: Load Supabase service-role key
        run: |
          api_keys_json="$(supabase projects api-keys --project-ref "$PROJECT_ID" --output json)"
          service_role_key="$(
            echo "$api_keys_json" | jq -r '
              (if type == "array" then . else (.api_keys // .keys // []) end)[]
              | select((((.name // .key_name // .type // .id // "") | ascii_downcase) == "service_role")
                or (((.name // .key_name // .type // .id // "") | ascii_downcase) | contains("service")))
              | (.api_key // .apiKey // .apikey // .key // .value // empty)
            ' | head -n 1
          )"

          if [ -z "$service_role_key" ] || [ "$service_role_key" = "null" ]; then
            echo "Unable to resolve Supabase service-role key from project API keys."
            exit 1
          fi

          echo "::add-mask::$service_role_key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Run Community Taxonomy import
        env:
          SUPABASE_URL: https://${{ env.PROJECT_ID }}.supabase.co
        run: |
          args=(
            --target "${{ inputs.target }}"
            --limit "${{ inputs.limit }}"
            --page-count "${{ inputs.page_count }}"
          )

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ "${{ inputs.retry }}" = "true" ]; then
            args+=(--retry)
          fi

          deno run --allow-net --allow-env \
            services/supabase/scripts/import_community_taxonomy.ts \
            "${args[@]}"
