name: Import Community Taxonomy

on:
  schedule:
    # Weekly Monday import at 09:20 UTC / 04:20 America/Chicago during CDT.
    - cron: "20 9 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: Taxonomy target to import.
        required: true
        default: birds
        type: choice
        options:
          - birds
      limit:
        description: Rows per GBIF page.
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "200"
      page_count:
        description: Number of pages to import in this run.
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "10"
          - "20"
      dry_run:
        description: Fetch and validate without writing taxonomy rows.
        required: true
        default: true
        type: boolean
      retry:
        description: Replay the last failed or most recent page when no offset is provided.
        required: true
        default: false
        type: boolean
      update_checklist:
        description: Update and commit the running checklist after a real import.
        required: true
        default: true
        type: boolean

concurrency:
  group: community-taxonomy-import-${{ inputs.target || 'birds' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production

    env:
      PROJECT_ID: qlarqavoqhkuwzmevrmf

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Validate import secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"

      - name: Load Supabase server API key
        id: service-role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          resolved_keys_json="$(
            deno run --quiet --frozen \
              --config services/supabase/functions/deno.json \
              --allow-env=SUPABASE_ACCESS_TOKEN \
              --allow-net=api.supabase.com \
              services/supabase/scripts/resolve_project_api_keys.ts \
              --project-ref "$PROJECT_ID"
          )"
          server_api_key="$(
            jq -er '.server_api_key' <<< "$resolved_keys_json"
          )"
          unset resolved_keys_json

          if [ -z "$server_api_key" ] || [ "$server_api_key" = "null" ]; then
            echo "Unable to resolve a Supabase secret or legacy service-role API key."
            exit 1
          fi

          echo "::add-mask::$server_api_key"
          echo "key=$server_api_key" >> "$GITHUB_OUTPUT"

      - name: Run Community Taxonomy import
        env:
          SUPABASE_SERVER_API_KEY: ${{ steps.service-role.outputs.key }}
          SUPABASE_URL: https://${{ env.PROJECT_ID }}.supabase.co
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_PAGE_COUNT: ${{ inputs.page_count }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RETRY: ${{ inputs.retry }}
          INPUT_UPDATE_CHECKLIST: ${{ inputs.update_checklist }}
        run: |
          target="${INPUT_TARGET:-birds}"
          limit="${INPUT_LIMIT:-100}"
          page_count="${INPUT_PAGE_COUNT:-20}"
          dry_run="${INPUT_DRY_RUN:-false}"
          retry="${INPUT_RETRY:-false}"
          update_checklist="${INPUT_UPDATE_CHECKLIST:-true}"

          summary_json="${RUNNER_TEMP}/community-taxonomy-import-summary.json"
          summary_md="${RUNNER_TEMP}/community-taxonomy-import-summary.md"
          args=(
            --target "$target"
            --limit "$limit"
            --page-count "$page_count"
            --summary-json "$summary_json"
            --summary-md "$summary_md"
          )

          if [ "$dry_run" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ "$retry" = "true" ]; then
            args+=(--retry)
          fi

          if [ "$dry_run" != "true" ] && [ "$update_checklist" = "true" ]; then
            args+=(--update-checklist)
          fi

          deno run --frozen \
            --config services/supabase/functions/deno.json \
            --allow-net="${PROJECT_ID}.supabase.co" \
            --allow-env=SUPABASE_URL,SUPABASE_SERVER_API_KEY,SUPABASE_SECRET_KEYS,SUPABASE_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY \
            --allow-read=docs/backend-and-data/07-community-taxonomy-import-checklist.md \
            --allow-write="$RUNNER_TEMP",docs/backend-and-data/07-community-taxonomy-import-checklist.md \
            services/supabase/scripts/import_community_taxonomy.ts \
            "${args[@]}"

          cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload import summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-taxonomy-import-summary-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/community-taxonomy-import-summary.json
            ${{ runner.temp }}/community-taxonomy-import-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload checklist candidate
        if: ${{ github.event_name == 'schedule' || (inputs.dry_run != true && inputs.update_checklist == true) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-taxonomy-checklist-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: docs/backend-and-data/07-community-taxonomy-import-checklist.md
          if-no-files-found: error
          retention-days: 1

  commit-checklist:
    needs: import
    if: ${{ github.event_name == 'schedule' || (inputs.dry_run != true && inputs.update_checklist == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Commit checklist update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_dir="${RUNNER_TEMP}/community-taxonomy-checklist"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "community-taxonomy-checklist-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --dir "$artifact_dir"
          install -m 0644 \
            "$artifact_dir/07-community-taxonomy-import-checklist.md" \
            docs/backend-and-data/07-community-taxonomy-import-checklist.md

          if git diff --quiet -- docs/backend-and-data/07-community-taxonomy-import-checklist.md; then
            echo "Checklist already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add docs/backend-and-data/07-community-taxonomy-import-checklist.md
          git commit -m "docs: record community taxonomy import run"
          git push
