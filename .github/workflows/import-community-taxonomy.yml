name: Import Community Taxonomy

on:
  schedule:
    # Weekly Monday import at 09:20 UTC / 04:20 America/Chicago during CDT.
    - cron: "20 9 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: Taxonomy target to import.
        required: true
        default: birds
        type: choice
        options:
          - birds
      limit:
        description: Rows per GBIF page.
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "200"
      page_count:
        description: Number of pages to import in this run.
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
      dry_run:
        description: Fetch and validate without writing taxonomy rows.
        required: true
        default: true
        type: boolean
      retry:
        description: Replay the last failed or most recent page when no offset is provided.
        required: true
        default: false
        type: boolean
      update_checklist:
        description: Update and commit the running checklist after a real import.
        required: true
        default: true
        type: boolean

concurrency:
  group: community-taxonomy-import-${{ inputs.target || 'birds' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    environment: Production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: qlarqavoqhkuwzmevrmf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Validate import secrets
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"

      - name: Load Supabase service-role key
        run: |
          api_keys_json="$(supabase projects api-keys --project-ref "$PROJECT_ID" --output json)"
          service_role_key="$(
            echo "$api_keys_json" | jq -r '
              (if type == "array" then . else (.api_keys // .keys // []) end)[]
              | select((((.name // .key_name // .type // .id // "") | ascii_downcase) == "service_role")
                or (((.name // .key_name // .type // .id // "") | ascii_downcase) | contains("service")))
              | (.api_key // .apiKey // .apikey // .key // .value // empty)
            ' | head -n 1
          )"

          if [ -z "$service_role_key" ] || [ "$service_role_key" = "null" ]; then
            echo "Unable to resolve Supabase service-role key from project API keys."
            exit 1
          fi

          echo "::add-mask::$service_role_key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Run Community Taxonomy import
        env:
          SUPABASE_URL: https://${{ env.PROJECT_ID }}.supabase.co
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_PAGE_COUNT: ${{ inputs.page_count }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RETRY: ${{ inputs.retry }}
          INPUT_UPDATE_CHECKLIST: ${{ inputs.update_checklist }}
        run: |
          target="${INPUT_TARGET:-birds}"
          limit="${INPUT_LIMIT:-100}"
          page_count="${INPUT_PAGE_COUNT:-5}"
          dry_run="${INPUT_DRY_RUN:-false}"
          retry="${INPUT_RETRY:-false}"
          update_checklist="${INPUT_UPDATE_CHECKLIST:-true}"

          summary_json="${RUNNER_TEMP}/community-taxonomy-import-summary.json"
          summary_md="${RUNNER_TEMP}/community-taxonomy-import-summary.md"
          args=(
            --target "$target"
            --limit "$limit"
            --page-count "$page_count"
            --summary-json "$summary_json"
            --summary-md "$summary_md"
          )

          if [ "$dry_run" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ "$retry" = "true" ]; then
            args+=(--retry)
          fi

          if [ "$dry_run" != "true" ] && [ "$update_checklist" = "true" ]; then
            args+=(--update-checklist)
          fi

          deno run --allow-net --allow-env --allow-read --allow-write \
            services/supabase/scripts/import_community_taxonomy.ts \
            "${args[@]}"

          cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload import summary
        uses: actions/upload-artifact@v4
        with:
          name: community-taxonomy-import-summary-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/community-taxonomy-import-summary.json
            ${{ runner.temp }}/community-taxonomy-import-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit checklist update
        if: ${{ github.event_name == 'schedule' || (inputs.dry_run != true && inputs.update_checklist == true) }}
        run: |
          if git diff --quiet -- docs/backend-and-data/07-community-taxonomy-import-checklist.md; then
            echo "Checklist already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backend-and-data/07-community-taxonomy-import-checklist.md
          git commit -m "docs: record community taxonomy import run"
          git push
