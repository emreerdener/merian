name: RevenueCat Reconciliation Health Monitor

on:
  schedule:
    # Every 15 minutes. GitHub scheduled jobs may be delayed under load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      warning_after_minutes:
        description: Oldest due age that produces a warning.
        required: true
        default: "30"
        type: choice
        options:
          - "15"
          - "30"
          - "45"
      critical_after_minutes:
        description: Oldest due age that produces a critical result.
        required: true
        default: "60"
        type: choice
        options:
          - "60"
          - "90"
          - "120"
      fail_on:
        description: Monitor severity that should fail the workflow.
        required: true
        default: warning
        type: choice
        options:
          - warning
          - critical
          - never

concurrency:
  group: revenuecat-reconciliation-health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production

    env:
      PROJECT_ID: qlarqavoqhkuwzmevrmf

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: ./.github/actions/setup-deno
        with:
          deno-version: v2.9.4

      - name: Validate monitor secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"

      - name: Load Supabase server API key
        id: service-role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          resolved_keys_json="$(
            deno run --quiet --frozen \
              --config services/supabase/functions/deno.json \
              --allow-env=SUPABASE_ACCESS_TOKEN \
              --allow-net=api.supabase.com \
              services/supabase/scripts/resolve_project_api_keys.ts \
              --project-ref "$PROJECT_ID"
          )"
          server_api_key="$(
            jq -er '.server_api_key' <<< "$resolved_keys_json"
          )"
          unset resolved_keys_json

          if [ -z "$server_api_key" ] || [ "$server_api_key" = "null" ]; then
            echo "Unable to resolve a Supabase secret or legacy service-role API key."
            exit 1
          fi

          echo "::add-mask::$server_api_key"
          echo "key=$server_api_key" >> "$GITHUB_OUTPUT"

      - name: Run RevenueCat reconciliation health monitor
        env:
          SUPABASE_SERVER_API_KEY: ${{ steps.service-role.outputs.key }}
          SUPABASE_URL: https://${{ env.PROJECT_ID }}.supabase.co
          INPUT_WARNING_AFTER_MINUTES: ${{ inputs.warning_after_minutes || '30' }}
          INPUT_CRITICAL_AFTER_MINUTES: ${{ inputs.critical_after_minutes || '60' }}
          INPUT_FAIL_ON: ${{ inputs.fail_on || 'warning' }}
        run: |
          summary_json="${RUNNER_TEMP}/revenuecat-reconciliation-health.json"
          summary_md="${RUNNER_TEMP}/revenuecat-reconciliation-health.md"
          warning_after="${INPUT_WARNING_AFTER_MINUTES:-30}"
          critical_after="${INPUT_CRITICAL_AFTER_MINUTES:-60}"
          fail_on="${INPUT_FAIL_ON:-warning}"

          # The deployed purchase-principal migration and post-deploy smoke
          # make this RPC mandatory. Missing or malformed principal health is
          # an alertable production failure, not a compatibility success.
          set +e
          deno run --frozen \
            --config services/supabase/functions/deno.json \
            --allow-net="${PROJECT_ID}.supabase.co" \
            --allow-env=SUPABASE_URL,SUPABASE_SERVER_API_KEY,MERIAN_SUPABASE_SERVER_API_KEY,SUPABASE_SECRET_KEYS,SUPABASE_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY \
            --allow-write="$RUNNER_TEMP" \
            services/supabase/scripts/monitor_revenuecat_reconciliation.ts \
            --warning-after-minutes "$warning_after" \
            --critical-after-minutes "$critical_after" \
            --fail-on "$fail_on" \
            --purchase-principal-health-mode required \
            --summary-json "$summary_json" \
            --summary-md "$summary_md"
          exit_code=$?
          set -e

          if [ -f "$summary_md" ]; then
            cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$exit_code"

      - name: Upload RevenueCat reconciliation health summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: revenuecat-reconciliation-health-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/revenuecat-reconciliation-health.json
            ${{ runner.temp }}/revenuecat-reconciliation-health.md
          if-no-files-found: warn
          retention-days: 30
