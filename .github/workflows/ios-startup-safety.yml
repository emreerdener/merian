name: iOS Startup Safety

on:
  pull_request:
    paths:
      - ".github/workflows/ios-startup-safety.yml"
      - "Makefile"
      - "Merian.xcodeproj/**"
      - "merian.xcodeproj/**"
      - "apps/ios/Merian/App/MerianApp.swift"
      - "apps/ios/Merian/App/MerianObjCExceptionBridge.*"
      - "apps/ios/Merian/Configuration/Merian-Bridging-Header.h"
      - "apps/ios/Merian/Core/Data/StoreRecovery/**"
      - "apps/ios/Merian/Models/Aliases.swift"
      - "apps/ios/Merian/Models/Schema/SchemaV49Snapshots.swift"
      - "apps/ios/Merian/Models/Schema/SchemaV50Snapshots.swift"
      - "apps/ios/Merian/Models/SchemaVersions.swift"
      - "apps/ios/MerianTests/App/ModelStoreRecoveryCoordinatorTests.swift"
      - "apps/ios/MerianTests/Models/MigrationPlanTests.swift"
      - "project.yml"
      - "scripts/check-ios-project-resources.sh"
      - "scripts/check-ios-release-prep.sh"
      - "scripts/check-ios-migration-source-guardrails.sh"
      - "scripts/ci-detect-startup-safety-source-changes.sh"
      - "scripts/select-ios-simulator-destination.sh"
      - "scripts/validate-ios-versioning.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-startup-safety.yml"
      - "Makefile"
      - "Merian.xcodeproj/**"
      - "merian.xcodeproj/**"
      - "apps/ios/Merian/App/MerianApp.swift"
      - "apps/ios/Merian/App/MerianObjCExceptionBridge.*"
      - "apps/ios/Merian/Configuration/Merian-Bridging-Header.h"
      - "apps/ios/Merian/Core/Data/StoreRecovery/**"
      - "apps/ios/Merian/Models/Aliases.swift"
      - "apps/ios/Merian/Models/Schema/SchemaV49Snapshots.swift"
      - "apps/ios/Merian/Models/Schema/SchemaV50Snapshots.swift"
      - "apps/ios/Merian/Models/SchemaVersions.swift"
      - "apps/ios/MerianTests/App/ModelStoreRecoveryCoordinatorTests.swift"
      - "apps/ios/MerianTests/Models/MigrationPlanTests.swift"
      - "project.yml"
      - "scripts/check-ios-project-resources.sh"
      - "scripts/check-ios-release-prep.sh"
      - "scripts/check-ios-migration-source-guardrails.sh"
      - "scripts/ci-detect-startup-safety-source-changes.sh"
      - "scripts/select-ios-simulator-destination.sh"
      - "scripts/validate-ios-versioning.sh"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

concurrency:
  group: ios-startup-safety-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  startup-store-recovery:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Initialize runner-local startup paths
        run: |
          : "${GITHUB_WORKSPACE:?Missing GITHUB_WORKSPACE}"
          : "${RUNNER_TEMP:?Missing RUNNER_TEMP}"
          {
            echo "SWIFT_PACKAGE_CLONES=$GITHUB_WORKSPACE/.build/xcode-source-packages"
            echo "SWIFT_PACKAGE_CACHE=$RUNNER_TEMP/startup-safety-package-cache"
          } >> "$GITHUB_ENV"

      - name: Summarize workflow context
        env:
          WORKFLOW_PURPOSE: "Focused iOS startup and SwiftData migration safety on macOS."
          WORKFLOW_REASON: "Runs for startup/schema/recovery/project changes, manual dispatch, and a daily scheduled drift check. It is not part of the Supabase backend deployment gate."
        run: bash scripts/ci-run-summary.sh

      - name: Verify pinned Xcode toolchain
        run: |
          if [ ! -x "$DEVELOPER_DIR/usr/bin/xcodebuild" ]; then
            echo "Pinned Xcode is unavailable at $DEVELOPER_DIR." >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          xcodebuild -version
          if [ "$(xcodebuild -version | sed -n '1p')" != "Xcode 26.6" ]; then
            echo "Startup Safety requires Xcode 26.6." >&2
            exit 1
          fi
          command -v jq >/dev/null

      - name: Validate generated project guardrails
        run: make validate-ios-project

      - name: Validate SwiftData migration source guardrails
        run: make validate-ios-migration-guardrails

      - name: Determine startup simulator scope
        id: startup-scope
        run: bash scripts/ci-detect-startup-safety-source-changes.sh

      - name: Restore Swift package checkouts
        if: steps.startup-scope.outputs.should_run == 'true'
        id: swift-package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-source-packages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-${{ hashFiles('Merian.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'merian.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve only Package.resolved versions
        if: steps.startup-scope.outputs.should_run == 'true'
        timeout-minutes: 10
        env:
          XCODE_PACKAGE_LOG: ${{ runner.temp }}/startup-safety-package-resolution.log
        run: |
          set -o pipefail
          xcode_project="Merian.xcodeproj"
          if [ ! -d "$xcode_project" ]; then
            xcode_project="merian.xcodeproj"
          fi
          package_resolved="$xcode_project/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ ! -s "$package_resolved" ] \
            || ! jq -e '(.pins | type) == "array" and (.pins | length) > 0' \
              "$package_resolved" >/dev/null; then
            echo "A non-empty checked-in Package.resolved is required." >&2
            exit 1
          fi
          xcodebuild -resolvePackageDependencies \
            -scheme Merian \
            -project "$xcode_project" \
            -clonedSourcePackagesDirPath "$SWIFT_PACKAGE_CLONES" \
            -packageCachePath "$SWIFT_PACKAGE_CACHE" \
            -disablePackageRepositoryCache \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            2>&1 | tee "$XCODE_PACKAGE_LOG"
          if ! git diff --quiet -- "$package_resolved"; then
            echo "Package resolution modified the checked-in lockfile." >&2
            git diff -- "$package_resolved"
            exit 1
          fi

      - name: Select iOS test simulator
        if: steps.startup-scope.outputs.should_run == 'true'
        id: ios-test-simulator
        run: |
          destination="$(bash scripts/select-ios-simulator-destination.sh)"
          echo "destination=${destination}" >> "$GITHUB_OUTPUT"
          echo "Selected ${destination}"

      - name: Build startup safety test bundle
        if: steps.startup-scope.outputs.should_run == 'true'
        timeout-minutes: 18
        env:
          XCODE_BUILD_LOG: ${{ runner.temp }}/startup-safety-xcodebuild.log
          XCODE_DERIVED_DATA: ${{ runner.temp }}/startup-safety-derived-data
        run: |
          set -o pipefail
          xcode_project="Merian.xcodeproj"
          if [ ! -d "$xcode_project" ]; then
            xcode_project="merian.xcodeproj"
          fi
          xcodebuild build-for-testing \
            -scheme Merian \
            -project "$xcode_project" \
            -destination "${{ steps.ios-test-simulator.outputs.destination }}" \
            -clonedSourcePackagesDirPath "$SWIFT_PACKAGE_CLONES" \
            -packageCachePath "$SWIFT_PACKAGE_CACHE" \
            -disablePackageRepositoryCache \
            -skipPackageUpdates \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$XCODE_DERIVED_DATA" \
            2>&1 | tee "$XCODE_BUILD_LOG"

      - name: Run startup and migration safety tests
        if: steps.startup-scope.outputs.should_run == 'true'
        timeout-minutes: 12
        env:
          XCODE_BUILD_LOG: ${{ runner.temp }}/startup-safety-xcodebuild.log
          XCODE_RESULT_BUNDLE: ${{ runner.temp }}/startup-safety.xcresult
          XCODE_DERIVED_DATA: ${{ runner.temp }}/startup-safety-derived-data
        run: |
          set -o pipefail
          xcode_project="Merian.xcodeproj"
          if [ ! -d "$xcode_project" ]; then
            xcode_project="merian.xcodeproj"
          fi
          xcodebuild test-without-building \
            -scheme Merian \
            -project "$xcode_project" \
            -destination "${{ steps.ios-test-simulator.outputs.destination }}" \
            -clonedSourcePackagesDirPath "$SWIFT_PACKAGE_CLONES" \
            -packageCachePath "$SWIFT_PACKAGE_CACHE" \
            -disablePackageRepositoryCache \
            -skipPackageUpdates \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$XCODE_DERIVED_DATA" \
            -resultBundlePath "$XCODE_RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -only-testing:merianTests/ModelStoreRecoveryCoordinatorTests \
            -only-testing:merianTests/MigrationPlanTests \
            2>&1 | tee -a "$XCODE_BUILD_LOG"

      - name: Save Swift package checkouts
        if: steps.startup-scope.outputs.should_run == 'true' && steps.swift-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-source-packages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-${{ hashFiles('Merian.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'merian.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Print startup safety failure summary
        if: failure() && steps.startup-scope.outputs.should_run == 'true'
        env:
          XCODE_BUILD_LOG: ${{ runner.temp }}/startup-safety-xcodebuild.log
          XCODE_RESULT_BUNDLE: ${{ runner.temp }}/startup-safety.xcresult
          XCODE_BUILD_DIAGNOSTICS: ${{ runner.temp }}/startup-safety-build-diagnostics.txt
          XCODE_TEST_SUMMARY: ${{ runner.temp }}/startup-safety-test-summary.json
        run: |
          append_build_diagnostics() {
            {
              echo ""
              echo "### Startup build diagnostics"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"

            if [ ! -f "$XCODE_BUILD_LOG" ]; then
              echo "No xcodebuild log was produced." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            grep -E "error:|fatal error:|xcodebuild: error|The following build commands failed|\\([0-9]+ failures\\)" "$XCODE_BUILD_LOG" > "$XCODE_BUILD_DIAGNOSTICS" || true
            if [ ! -s "$XCODE_BUILD_DIAGNOSTICS" ]; then
              tail -n 120 "$XCODE_BUILD_LOG" > "$XCODE_BUILD_DIAGNOSTICS"
            fi

            {
              echo '```text'
              head -n 120 "$XCODE_BUILD_DIAGNOSTICS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ ! -d "$XCODE_RESULT_BUNDLE" ]; then
            echo "No startup safety result bundle was produced."
            append_build_diagnostics
            exit 0
          fi

          if ! xcrun xcresulttool get test-results summary \
            --path "$XCODE_RESULT_BUNDLE" > "$XCODE_TEST_SUMMARY"; then
            echo "Unable to extract startup safety test summary."
            append_build_diagnostics
            exit 0
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is unavailable; raw startup safety test summary:"
            cat "$XCODE_TEST_SUMMARY"
            append_build_diagnostics
            exit 0
          fi

          jq -r '
            def clean:
              tostring
              | gsub("\\|"; "\\|")
              | gsub("\r?\n"; "<br>");
            def failures:
              if (.testFailures | type) == "array" then .testFailures
              elif (.testFailures | type) == "object" and (.testFailures | length) > 0 then [.testFailures]
              else [] end;

            [
              "### Startup safety result",
              "",
              "- Result: `\(.result)`",
              "- Passed: `\(.passedTests)`",
              "- Failed: `\(.failedTests)`",
              "- Skipped: `\(.skippedTests)`",
              ""
            ]
            + (
              if (.result == "unknown" and (.passedTests // 0) == 0 and (.failedTests // 0) == 0 and (.skippedTests // 0) == 0) then
                ["No selected startup tests ran. Xcode failed before the test phase; see build diagnostics below."]
              elif (failures | length) > 0 then
                ["| Test | Failure |", "| --- | --- |"]
                + (failures | map("| `\(.testName | clean)` | \(.failureText | clean) |"))
              else
                ["No individual test failures were reported in the result summary."]
              end
            )
            | .[]
          ' "$XCODE_TEST_SUMMARY" | tee -a "$GITHUB_STEP_SUMMARY" || {
            echo "Unable to render startup safety failure summary."
            cat "$XCODE_TEST_SUMMARY"
          }

          if jq -e '.result == "unknown" and (.passedTests // 0) == 0 and (.failedTests // 0) == 0 and (.skippedTests // 0) == 0' "$XCODE_TEST_SUMMARY" >/dev/null; then
            append_build_diagnostics
          fi

      - name: Upload startup safety result bundle
        if: failure() && steps.startup-scope.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-startup-safety-xcresult-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/startup-safety.xcresult
            ${{ runner.temp }}/startup-safety-test-summary.json
            ${{ runner.temp }}/startup-safety-xcodebuild.log
            ${{ runner.temp }}/startup-safety-package-resolution.log
            ${{ runner.temp }}/startup-safety-build-diagnostics.txt
          if-no-files-found: ignore
