name: Account Deletion Health Monitor

on:
  schedule:
    # Every five minutes, offset from the database reaper.
    # GitHub scheduled jobs may be delayed under load.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      warning_due_after_minutes:
        description: Oldest claimable work age that produces a warning.
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
      critical_due_after_minutes:
        description: Oldest claimable work age that produces a critical result.
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "60"
          - "120"
      warning_sla_hours:
        description: Oldest active deletion age that produces a warning.
        required: true
        default: "27"
        type: choice
        options:
          - "26"
          - "27"
          - "30"
      critical_sla_hours:
        description: Oldest active deletion age that produces a critical result.
        required: true
        default: "36"
        type: choice
        options:
          - "36"
          - "48"
          - "72"
      warning_backlog:
        description: Active deletion count that produces a warning.
        required: true
        default: "25"
        type: choice
        options:
          - "10"
          - "25"
          - "50"
      critical_backlog:
        description: Active deletion count that produces a critical result.
        required: true
        default: "100"
        type: choice
        options:
          - "100"
          - "250"
          - "500"
      fail_on:
        description: Monitor severity that should fail the workflow.
        required: true
        default: warning
        type: choice
        options:
          - warning
          - critical
          - never

concurrency:
  group: account-deletion-health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production

    env:
      PROJECT_ID: qlarqavoqhkuwzmevrmf

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Validate monitor secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"

      - name: Load Supabase server API key
        id: service-role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          resolved_keys_json="$(
            deno run --quiet --frozen \
              --config services/supabase/functions/deno.json \
              --allow-env=SUPABASE_ACCESS_TOKEN \
              --allow-net=api.supabase.com \
              services/supabase/scripts/resolve_project_api_keys.ts \
              --project-ref "$PROJECT_ID"
          )"
          server_api_key="$(
            jq -er '.server_api_key' <<< "$resolved_keys_json"
          )"
          unset resolved_keys_json

          if [ -z "$server_api_key" ] || [ "$server_api_key" = "null" ]; then
            echo "Unable to resolve a Supabase secret or legacy service-role API key."
            exit 1
          fi

          echo "::add-mask::$server_api_key"
          echo "key=$server_api_key" >> "$GITHUB_OUTPUT"

      - name: Run account deletion health monitor
        env:
          SUPABASE_SERVER_API_KEY: ${{ steps.service-role.outputs.key }}
          SUPABASE_URL: https://${{ env.PROJECT_ID }}.supabase.co
          INPUT_WARNING_DUE_AFTER_MINUTES: ${{ inputs.warning_due_after_minutes || '10' }}
          INPUT_CRITICAL_DUE_AFTER_MINUTES: ${{ inputs.critical_due_after_minutes || '30' }}
          INPUT_WARNING_SLA_HOURS: ${{ inputs.warning_sla_hours || '27' }}
          INPUT_CRITICAL_SLA_HOURS: ${{ inputs.critical_sla_hours || '36' }}
          INPUT_WARNING_BACKLOG: ${{ inputs.warning_backlog || '25' }}
          INPUT_CRITICAL_BACKLOG: ${{ inputs.critical_backlog || '100' }}
          INPUT_FAIL_ON: ${{ inputs.fail_on || 'warning' }}
        run: |
          summary_json="${RUNNER_TEMP}/account-deletion-health.json"
          summary_md="${RUNNER_TEMP}/account-deletion-health.md"
          warning_due="${INPUT_WARNING_DUE_AFTER_MINUTES:-10}"
          critical_due="${INPUT_CRITICAL_DUE_AFTER_MINUTES:-30}"
          warning_sla="${INPUT_WARNING_SLA_HOURS:-27}"
          critical_sla="${INPUT_CRITICAL_SLA_HOURS:-36}"
          warning_backlog="${INPUT_WARNING_BACKLOG:-25}"
          critical_backlog="${INPUT_CRITICAL_BACKLOG:-100}"
          fail_on="${INPUT_FAIL_ON:-warning}"

          set +e
          deno run --frozen \
            --config services/supabase/functions/deno.json \
            --allow-net="${PROJECT_ID}.supabase.co" \
            --allow-env=SUPABASE_URL,SUPABASE_SERVER_API_KEY,MERIAN_SUPABASE_SERVER_API_KEY,SUPABASE_SECRET_KEYS,SUPABASE_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY \
            --allow-write="$RUNNER_TEMP" \
            services/supabase/scripts/monitor_account_deletion_health.ts \
            --warning-due-after-minutes "$warning_due" \
            --critical-due-after-minutes "$critical_due" \
            --warning-sla-hours "$warning_sla" \
            --critical-sla-hours "$critical_sla" \
            --warning-backlog "$warning_backlog" \
            --critical-backlog "$critical_backlog" \
            --fail-on "$fail_on" \
            --summary-json "$summary_json" \
            --summary-md "$summary_md"
          exit_code=$?
          set -e

          if [ -f "$summary_md" ]; then
            cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$exit_code"

      - name: Upload account deletion health summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-deletion-health-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/account-deletion-health.json
            ${{ runner.temp }}/account-deletion-health.md
          if-no-files-found: warn
          retention-days: 30
