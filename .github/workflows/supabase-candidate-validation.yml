name: Supabase Candidate Validation

on:
  # Always report the final gate for pull requests. The lightweight scope job
  # resolves the complete change set without GitHub's event path-filter limit.
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: supabase-candidate-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine Supabase candidate scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.candidate-scope.outputs.should_run }}
      reason: ${{ steps.candidate-scope.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The detector compares the complete event range rather than relying
          # on GitHub's path-filtered changed-file window.
          fetch-depth: 0
          persist-credentials: false

      - name: Summarize workflow context
        env:
          WORKFLOW_PURPOSE: "Fail-closed scope plus validation-only Supabase release evidence without production access."
          WORKFLOW_REASON: "The final check reports on every pull request; complete disposable-database validation runs for every inspected contract input and every reusable, manual, or merge-queue invocation."
        run: bash scripts/ci-run-summary.sh

      - name: Test candidate scope detector
        run: bash scripts/test-ci-detect-supabase-candidate-source-changes.sh

      - name: Determine complete validation scope
        id: candidate-scope
        run: bash scripts/ci-detect-supabase-candidate-source-changes.sh

  validate:
    name: Validate exact candidate SHA
    needs: scope
    if: needs.scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services

    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Summarize workflow context
        env:
          WORKFLOW_PURPOSE: "Validation-only Supabase release gate: verify Edge code, replay migrations, exercise database concurrency, and run database lint without accessing production."
          WORKFLOW_REASON: "The fail-closed scope job required complete validation for this pull request, merge-queue commit, manual candidate, or reusable production prerequisite."
        run: bash ../scripts/ci-run-summary.sh

      - name: Test workflow summary rendering
        run: bash ../scripts/test-ci-run-summary.sh

      - name: Verify exact clean source revision
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "Expected workflow SHA $GITHUB_SHA, checked out $actual_sha." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Checkout is dirty before Supabase candidate validation." >&2
            git status --short
            exit 1
          fi
          echo "Verified clean candidate revision $actual_sha"

      - name: Setup Deno
        uses: ./.github/actions/setup-deno
        with:
          deno-version: v2.9.4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Validate reviewed Supabase CLI
        run: bash supabase/scripts/require_supabase_cli_version.sh

      - name: Gate whole-tree Supabase formatting
        run: deno fmt --check supabase/functions supabase/scripts

      - name: Gate whole-tree Supabase TypeScript lint
        run: |
          deno lint --config supabase/functions/deno.json \
            supabase/functions \
            supabase/scripts

      - name: Test complete Supabase tooling suite
        run: bash supabase/scripts/test_supabase_tooling.sh

      - name: Validate isolated Edge Function dependency graphs
        run: |
          deno run --frozen --config supabase/functions/deno.json \
            --allow-read=supabase \
            supabase/scripts/sync_function_deno_configs.ts --check

          deno run --frozen --config supabase/functions/deno.json \
            --allow-read=supabase \
            supabase/scripts/validate_function_dependencies.ts

          checked=0
          for entrypoint in supabase/functions/*/index.ts; do
            function_dir="${entrypoint%/index.ts}"
            deno check --frozen \
              --config "$function_dir/deno.json" \
              "$entrypoint"
            checked=$((checked + 1))
          done
          echo "Checked $checked Edge Function entrypoints with deploy-time configs."

      - name: Test production workflow security
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/functions/deno.json,../.github/workflows,../.github/actions/setup-deno,../.github/CODEOWNERS \
            supabase/functions/_tests/workflowSecurity.test.ts

      - name: Validate Supabase migration contracts
        run: bash supabase/scripts/validate_migration_contracts.sh

      - name: Start disposable database
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-schema-validation-placeholder
        run: supabase db start

      - name: Validate database security catalogs
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: bash supabase/scripts/test_database_catalogs.sh

      - name: Test complete Edge Function and database concurrency suite
        env:
          SUPABASE_DB_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: deno task --config supabase/functions/deno.json test

      - name: Validate database lint and advisors
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          supabase db lint --local --schema public,internal \
            --level warning --fail-on warning
          supabase db advisors --local --type security \
            --level warn --fail-on error
          supabase db advisors --local --type performance \
            --level warn --fail-on error

      - name: Stop disposable database
        if: always()
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: supabase stop --no-backup

      - name: Summarize candidate evidence
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Supabase candidate validation"
            echo
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Result: $VALIDATION_STATUS"
            echo "- Production environment: not used"
            echo "- Production secrets: not used"
            echo "- Production mutations: none"
          } >> "$GITHUB_STEP_SUMMARY"

  candidate-readiness:
    name: Candidate readiness
    needs:
      - scope
      - validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce Supabase candidate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SHOULD_RUN: ${{ needs.scope.outputs.should_run }}
          SCOPE_REASON: ${{ needs.scope.outputs.reason }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          {
            echo "### Supabase candidate-readiness decision"
            echo
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Scope job: \`${SCOPE_RESULT}\`"
            echo "- Complete validation required: \`${SHOULD_RUN:-unknown}\`"
            echo "- Scope reason: ${SCOPE_REASON:-unavailable}"
            echo "- Disposable candidate validation: \`${VALIDATION_RESULT}\`"
            echo "- Production environment: not used"
            echo "- Production secrets: not used"
            echo "- Production mutations: none"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "The Supabase candidate scope job did not succeed." >&2
            exit 1
          fi

          if [ "$SHOULD_RUN" != "true" ]; then
            if [ "$VALIDATION_RESULT" != "skipped" ]; then
              echo "Complete validation ran unexpectedly for an out-of-scope change." >&2
              exit 1
            fi
            echo "No Supabase candidate contract input changed; the required check reports success."
            exit 0
          fi

          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Supabase candidate validation result: ${VALIDATION_RESULT:-unknown}." >&2
            echo "The complete disposable-database gate must pass." >&2
            exit 1
          fi

          echo "The exact workflow SHA passed complete Supabase candidate validation."
