name: iOS TestFlight Publisher (Advanced)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Plan, create a candidate, upload a new candidate, or upload an existing immutable candidate"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - candidate
          - upload
          - upload-existing
          - retry-upload
      latest_asc_build:
        description: "Read-only App Store Connect anchor for plan mode only"
        required: false
        type: string
      source_run_id:
        description: "Publisher run containing the candidate artifact (upload-existing/retry-upload)"
        required: false
        type: string
      candidate_artifact_name:
        description: "Exact candidate artifact name from source_run_id"
        required: false
        type: string
      external_state_confirmation:
        description: "Type RESERVE BUILD for candidate/upload"
        required: false
        type: string
      upload_confirmation:
        description: "Type UPLOAD TO APP STORE CONNECT for any upload"
        required: false
        type: string
      failed_upload_confirmation:
        description: "Type FAILED CONFIRMED for retry-upload only"
        required: false
        type: string
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      latest_asc_build:
        required: false
        type: string
        default: ""
      source_run_id:
        required: false
        type: string
        default: ""
      candidate_artifact_name:
        required: false
        type: string
        default: ""
      external_state_confirmation:
        required: false
        type: string
        default: ""
      upload_confirmation:
        required: false
        type: string
        default: ""
      failed_upload_confirmation:
        required: false
        type: string
        default: ""

# Non-plan modes push durable iOS allocation, evidence, and upload tags.
permissions:
  actions: read
  contents: write

concurrency:
  group: ios-testflight-publisher
  cancel-in-progress: false

jobs:
  readiness:
    name: Wait for exact-SHA iOS production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: none
    outputs:
      green_run_id: ${{ steps.green-gate.outputs.run_id }}

    steps:
      - name: Wait for successful exact-SHA iOS build
        id: green-gate
        if: inputs.action == 'candidate' || inputs.action == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs_json="$RUNNER_TEMP/ios-green-runs.json"
          jobs_json="$RUNNER_TEMP/ios-green-jobs.json"
          max_attempts=61
          poll_seconds=30

          for attempt in $(seq 1 "$max_attempts"); do
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-build-and-test.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              > "$runs_json"

            green_run_id=""
            while IFS= read -r candidate_run_id; do
              [[ "$candidate_run_id" =~ ^[1-9][0-9]*$ ]] || continue
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?per_page=100" \
                > "$jobs_json"

              required_jobs_passed=true
              for required_job in \
                "Full iOS unit tests" \
                "Current-SHA Release archive" \
                "Production readiness"; do
                if ! jq -e --arg name "$required_job" \
                  '.jobs | any(.name == $name and .conclusion == "success")' \
                  "$jobs_json" >/dev/null; then
                  required_jobs_passed=false
                  break
                fi
              done
              if [ "$required_jobs_passed" = true ]; then
                green_run_id="$candidate_run_id"
                break
              fi
            done < <(
              jq -r --arg sha "$GITHUB_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.id) | reverse | .[].id' \
                "$runs_json"
            )
            if [[ "$green_run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "run_id=$green_run_id" >> "$GITHUB_OUTPUT"
              echo "Verified exact-SHA green run $green_run_id for $GITHUB_SHA."
              exit 0
            fi

            latest_run="$(
              jq -r --arg sha "$GITHUB_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.id) | last | select(. != null) | [.id, .status, (.conclusion // ""), .html_url] | @tsv' \
                "$runs_json"
            )"
            if [ -n "$latest_run" ]; then
              IFS=$'\t' read -r latest_run_id latest_status latest_conclusion latest_url <<< "$latest_run"
              if [ "$latest_status" = "completed" ]; then
                if [ "$latest_conclusion" = "success" ]; then
                  echo "Exact-SHA run $latest_run_id succeeded without all required macOS jobs." >&2
                  echo "Manually dispatch iOS Build and Test on main, then run TestFlight Beta again." >&2
                  exit 1
                fi
                echo "Exact-SHA iOS Build and Test run $latest_run_id completed with conclusion ${latest_conclusion:-unknown}." >&2
                echo "$latest_url" >&2
                exit 1
              fi
              echo "Waiting for exact-SHA iOS run $latest_run_id (${latest_status:-unknown}); attempt $attempt/$max_attempts."
            else
              echo "Waiting for an iOS Build and Test run for $GITHUB_SHA; attempt $attempt/$max_attempts."
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$poll_seconds"
            fi
          done

          echo "Timed out after 30 minutes waiting for successful iOS Build and Test jobs for exact SHA $GITHUB_SHA." >&2
          exit 1

  publish:
    name: Serialized iOS publisher
    needs: readiness
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout exact selected ref with release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify selected action and explicit authorization
        env:
          PUBLISH_ACTION: ${{ inputs.action }}
          EXTERNAL_CONFIRMATION: ${{ inputs.external_state_confirmation }}
          UPLOAD_CONFIRMATION: ${{ inputs.upload_confirmation }}
          FAILED_CONFIRMATION: ${{ inputs.failed_upload_confirmation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          LATEST_ASC_BUILD: ${{ inputs.latest_asc_build }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Publisher requires a manual workflow_dispatch caller." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publisher actions are restricted to protected main." >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          selected_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ] \
            || [ "$selected_main_sha" != "$GITHUB_SHA" ]; then
            echo "Publisher checkout, selected main, and workflow SHA must be identical." >&2
            exit 1
          fi

          case "$PUBLISH_ACTION" in
            plan)
              if ! [[ "$LATEST_ASC_BUILD" =~ ^(0|[1-9][0-9]*)$ ]]; then
                echo "Plan mode requires a numeric latest_asc_build anchor." >&2
                exit 1
              fi
              ;;
            candidate)
              if [ "$EXTERNAL_CONFIRMATION" != "RESERVE BUILD" ]; then
                echo "Candidate mode requires the exact RESERVE BUILD confirmation." >&2
                exit 1
              fi
              ;;
            upload)
              if [ "$EXTERNAL_CONFIRMATION" != "RESERVE BUILD" ] \
                || [ "$UPLOAD_CONFIRMATION" != "UPLOAD TO APP STORE CONNECT" ]; then
                echo "Upload mode requires both exact confirmations." >&2
                exit 1
              fi
              ;;
            upload-existing)
              if [ "$UPLOAD_CONFIRMATION" != "UPLOAD TO APP STORE CONNECT" ] \
                || ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] \
                || [ -z "$CANDIDATE_ARTIFACT_NAME" ]; then
                echo "Existing upload requires confirmation, source_run_id, and candidate_artifact_name." >&2
                exit 1
              fi
              ;;
            retry-upload)
              if [ "$UPLOAD_CONFIRMATION" != "UPLOAD TO APP STORE CONNECT" ] \
                || [ "$FAILED_CONFIRMATION" != "FAILED CONFIRMED" ] \
                || ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] \
                || [ -z "$CANDIDATE_ARTIFACT_NAME" ]; then
                echo "Retry requires upload confirmation, definitive Failed confirmation, source_run_id, and artifact name." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported publisher action: $PUBLISH_ACTION" >&2
              exit 1
              ;;
          esac

      - name: Download immutable existing candidate
        if: inputs.action == 'upload-existing' || inputs.action == 'retry-upload'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
        run: |
          mkdir "$RUNNER_TEMP/existing-candidate"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$CANDIDATE_ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/existing-candidate"
          evidence_count="$(find "$RUNNER_TEMP/existing-candidate" -name evidence.json -type f | wc -l | tr -d '[:space:]')"
          ipa_count="$(find "$RUNNER_TEMP/existing-candidate" -name '*.ipa' -type f | wc -l | tr -d '[:space:]')"
          if [ "$evidence_count" != "1" ] || [ "$ipa_count" != "1" ]; then
            echo "Candidate artifact must contain exactly one evidence.json and one IPA." >&2
            exit 1
          fi

      - name: Run read-only allocation-to-upload plan
        if: inputs.action == 'plan'
        env:
          LATEST_ASC_BUILD: ${{ inputs.latest_asc_build }}
          MERIAN_PUBLISHER_SERIALIZED: "1"
          PUBLISHER_GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-ios-beta.sh --dry-run

      - name: Configure credentials and run publisher
        id: publisher
        if: inputs.action != 'plan'
        env:
          PUBLISH_ACTION: ${{ inputs.action }}
          GREEN_RUN_ID: ${{ needs.readiness.outputs.green_run_id }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PUBLISHER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for required_name in ASC_APP_ID ASC_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_P8_BASE64; do
            if [ -z "${!required_name:-}" ]; then
              echo "Missing required publisher secret: $required_name" >&2
              exit 1
            fi
          done

          private_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          certificate_path="$RUNNER_TEMP/ios-distribution.p12"
          keychain_path="$RUNNER_TEMP/merian-publisher-${GITHUB_RUN_ID}.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() {
            rm -f "$private_key_path" "$certificate_path"
            if [ -f "$keychain_path" ]; then
              security delete-keychain "$keychain_path" || true
            fi
          }
          trap cleanup EXIT
          trap 'exit 130' HUP INT TERM

          printf '%s' "$ASC_PRIVATE_KEY_P8_BASE64" | /usr/bin/base64 -D > "$private_key_path"
          chmod 600 "$private_key_path"
          unset ASC_PRIVATE_KEY_P8_BASE64
          export ASC_PRIVATE_KEY_PATH="$private_key_path"
          export MERIAN_PUBLISHER_SERIALIZED=1
          git config user.name "Merian iOS Publisher"
          git config user.email "ios-publisher@merian.app"

          case "$PUBLISH_ACTION" in
            candidate | upload)
              if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" ] \
                || [ -z "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]; then
                echo "New candidates require the distribution certificate secrets." >&2
                exit 1
              fi
              printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
              security create-keychain -p "$keychain_password" "$keychain_path"
              security set-keychain-settings -lut 21600 "$keychain_path"
              security unlock-keychain -p "$keychain_password" "$keychain_path"
              security import "$certificate_path" \
                -k "$keychain_path" \
                -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
                -T /usr/bin/codesign \
                -T /usr/bin/security
              security set-key-partition-list \
                -S apple-tool:,apple:,codesign: \
                -s \
                -k "$keychain_password" \
                "$keychain_path"
              security list-keychains -d user -s "$keychain_path" login.keychain-db
              rm -f "$certificate_path"
              unset IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
              export MERIAN_GREEN_SHA="$GITHUB_SHA"
              export MERIAN_GREEN_RUN_ID="$GREEN_RUN_ID"
              if [ "$PUBLISH_ACTION" = "candidate" ]; then
                bash scripts/publish-ios-beta.sh --candidate --confirm-external-state
              else
                bash scripts/publish-ios-beta.sh --upload --confirm-external-state --confirm-upload
              fi
              ;;
            upload-existing | retry-upload)
              unset IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
              evidence_path="$(find "$RUNNER_TEMP/existing-candidate" -name evidence.json -type f)"
              ipa_path="$(find "$RUNNER_TEMP/existing-candidate" -name '*.ipa' -type f)"
              if [ "$PUBLISH_ACTION" = "upload-existing" ]; then
                bash scripts/publish-ios-beta.sh \
                  --upload-existing "$evidence_path" \
                  --ipa "$ipa_path" \
                  --confirm-upload
              else
                bash scripts/publish-ios-beta.sh \
                  --retry-upload "$evidence_path" \
                  --ipa "$ipa_path" \
                  --confirm-upload \
                  --confirm-failed-upload
              fi
              ;;
          esac

      - name: Upload dry-run plan
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-beta-publisher-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: build/ios-publisher/plans/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable candidate and evidence
        if: success() && (inputs.action == 'candidate' || inputs.action == 'upload')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-beta-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            build/ios-publisher/*/evidence.json
            build/ios-publisher/*/export/*.ipa
            build/ios-publisher/*/upload.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve candidate or diagnostics after publisher failure
        if: failure() && steps.publisher.outcome == 'failure' && (inputs.action == 'candidate' || inputs.action == 'upload')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-beta-publisher-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            build/ios-publisher/*/evidence.json
            build/ios-publisher/*/export/*.ipa
            build/ios-publisher/*/upload.log
            build/ios-publisher/*/plan.json
            build/ios-publisher/*/archive.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

      - name: Upload existing candidate with receipt evidence
        if: always() && (inputs.action == 'upload-existing' || inputs.action == 'retry-upload')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-beta-upload-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/existing-candidate/**/evidence.json
            ${{ runner.temp }}/existing-candidate/**/*.ipa
            ${{ runner.temp }}/existing-candidate/**/*.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
