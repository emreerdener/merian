name: iOS Candidate Runtime Discovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover:
    if: github.ref == 'refs/heads/codex/pr152-simulator-diagnostics-20261114'
    name: Diagnose retained saved-video suite
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify harness and pinned compiler
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 27.0'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 27A266a'
      - name: Verify immutable product origin
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/diagnose-ios-service-hub.py origin --directory "$RUNNER_TEMP/host-diagnostic"
      - name: Download retained products
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: emreerdener/merian
          run-id: 43907897503
          artifact-ids: 14254796716
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/diagnostic-input
      - name: Download retained plan
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: emreerdener/merian
          run-id: 43907897503
          artifact-ids: 14255320920
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/diagnostic-input
      - name: Verify and unpack exact retained products
        timeout-minutes: 5
        run: |
          python3 -B scripts/diagnose-ios-service-hub.py inputs \
            --directory "$RUNNER_TEMP/host-diagnostic" --inputs "$RUNNER_TEMP/diagnostic-input" \
            --products "$RUNNER_TEMP/diagnostic-products"
          python3 -B scripts/diagnose-ios-service-hub.py snapshot \
            --directory "$RUNNER_TEMP/host-diagnostic" --phase before_prepare
      - name: Prepare exact preinstalled runtime on owned device
        id: simulator
        timeout-minutes: 20
        run: |
          mkdir "$RUNNER_TEMP/host-diagnostic/identity"
          destination="$(python3 -B scripts/discover-ios27-simulator.py --prepare-only \
            --evidence "$RUNNER_TEMP/host-diagnostic/identity/preparation.json")"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          python3 -B scripts/diagnose-ios-service-hub.py snapshot \
            --directory "$RUNNER_TEMP/host-diagnostic" --phase before_test
      - name: Observe guest identity inside XCTest
        id: identity-test
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test-without-building -testProductsPath "$RUNNER_TEMP/diagnostic-products/tests.xctestproducts" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath "$RUNNER_TEMP/host-diagnostic/identity/results.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:merianTests/SimulatorRuntimeIdentityTests/testRecordsBootedGuestIdentity \
            2>&1 | tee "$RUNNER_TEMP/host-diagnostic/identity/test.log"
      - name: Validate diagnostic identity only
        if: always()
        timeout-minutes: 5
        env:
          IOS_IDENTITY_TEST_OUTCOME: ${{ steps.identity-test.outcome }}
        run: |
          evidence="$RUNNER_TEMP/host-diagnostic/identity"
          if [ -d "$evidence/results.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$evidence/results.xcresult" > "$evidence/summary.json" || true
            xcrun xcresulttool get test-results tests --path "$evidence/results.xcresult" > "$evidence/tests.json" || true
            xcrun xcresulttool export attachments --path "$evidence/results.xcresult" \
              --test-id 'SimulatorRuntimeIdentityTests/testRecordsBootedGuestIdentity()' \
              --output-path "$evidence/attachments" || true
          fi
          python3 -B scripts/diagnose-ios-service-hub.py finish --directory "$RUNNER_TEMP/host-diagnostic"
          git diff --quiet --ignore-submodules --
      - name: Enumerate complete retained saved-video suite
        id: suite-enumeration
        timeout-minutes: 5
        env:
          IOS_IDENTITY_TEST_OUTCOME: ${{ steps.identity-test.outcome }}
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/host-diagnostic/suite"
          xcodebuild test-without-building -testProductsPath "$RUNNER_TEMP/diagnostic-products/tests.xctestproducts" \
            -destination "${{ steps.simulator.outputs.destination }}" -parallel-testing-enabled NO \
            -only-testing:merianTests/CaptureSavedVideoPreviewTests \
            -enumerate-tests -test-enumeration-style flat -test-enumeration-format text \
            -test-enumeration-output-path "$RUNNER_TEMP/host-diagnostic/suite/enumeration.txt" \
            2>&1 | tee "$RUNNER_TEMP/host-diagnostic/suite/enumeration.log"
          python3 -B scripts/diagnose-ios-service-hub.py suite-enumeration \
            --directory "$RUNNER_TEMP/host-diagnostic" --inputs "$RUNNER_TEMP/diagnostic-input"
      - name: Run complete retained saved-video suite once
        id: suite-test
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test-without-building -testProductsPath "$RUNNER_TEMP/diagnostic-products/tests.xctestproducts" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath "$RUNNER_TEMP/host-diagnostic/suite/results.xcresult" \
            -parallel-testing-enabled NO -only-testing:merianTests/CaptureSavedVideoPreviewTests \
            2>&1 | tee "$RUNNER_TEMP/host-diagnostic/suite/test.log"
      - name: Validate complete suite diagnostic only
        if: always()
        timeout-minutes: 5
        env:
          IOS_IDENTITY_TEST_OUTCOME: ${{ steps.identity-test.outcome }}
          IOS_SUITE_ENUMERATION_OUTCOME: ${{ steps.suite-enumeration.outcome }}
          IOS_SUITE_TEST_OUTCOME: ${{ steps.suite-test.outcome }}
        run: |
          evidence="$RUNNER_TEMP/host-diagnostic/suite"
          if [ -d "$evidence/results.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$evidence/results.xcresult" > "$evidence/summary.json" || true
            xcrun xcresulttool get test-results tests --path "$evidence/results.xcresult" > "$evidence/tests.json" || true
          fi
          python3 -B scripts/diagnose-ios-service-hub.py finish-suite \
            --directory "$RUNNER_TEMP/host-diagnostic" --inputs "$RUNNER_TEMP/diagnostic-input"
          git diff --quiet --ignore-submodules --
      - name: Observe host after suite attempt
        if: always() && steps.simulator.outcome == 'success'
        timeout-minutes: 2
        run: |
          python3 -B scripts/diagnose-ios-service-hub.py snapshot \
            --directory "$RUNNER_TEMP/host-diagnostic" --phase after_test
      - name: Retain nonqualifying diagnostic evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-retained-suite-diagnostic-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/host-diagnostic/suite-diagnostic.json
            ${{ runner.temp }}/host-diagnostic/suite/enumeration.txt
            ${{ runner.temp }}/host-diagnostic/suite/enumeration.log
            ${{ runner.temp }}/host-diagnostic/suite/summary.json
            ${{ runner.temp }}/host-diagnostic/suite/tests.json
            ${{ runner.temp }}/host-diagnostic/suite/test.log
            ${{ runner.temp }}/host-diagnostic/diagnostic.json
            ${{ runner.temp }}/host-diagnostic/before_prepare.json
            ${{ runner.temp }}/host-diagnostic/before_test.json
            ${{ runner.temp }}/host-diagnostic/after_test.json
            ${{ runner.temp }}/host-diagnostic/identity/preparation.json
            ${{ runner.temp }}/host-diagnostic/identity/summary.json
            ${{ runner.temp }}/host-diagnostic/identity/tests.json
            ${{ runner.temp }}/host-diagnostic/identity/attachments
            ${{ runner.temp }}/host-diagnostic/identity/test.log
          if-no-files-found: error
          retention-days: 14
      - name: Retain suite failure result
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-retained-suite-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-diagnostic/suite/results.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
