name: iOS Candidate Runtime Discovery

on:
  push:
    branches:
      - codex/pr152-simulator-diagnostics-20261114

permissions:
  contents: read

jobs:
  discover:
    name: Observe exact iOS 27 candidate identity
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and compiler
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 27.0'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 27A266a'
      - name: Observe preinstalled runtime on owned device
        timeout-minutes: 20
        run: python3 -B scripts/discover-ios27-simulator.py --evidence "$RUNNER_TEMP/ios27-discovery.json"
      - name: Retain non-release identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios27-discovery-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios27-discovery.json
          if-no-files-found: error
          retention-days: 14
