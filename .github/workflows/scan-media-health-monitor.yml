name: Scan Media Health Monitor

on:
  schedule:
    # Every 30 minutes. GitHub scheduled jobs may be delayed under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum rows sampled per issue type.
        required: true
        default: "25"
        type: choice
        options:
          - "10"
          - "25"
          - "50"
          - "100"
      recent_scan_limit:
        description: Number of recent scan rows sampled for media drift.
        required: true
        default: "250"
        type: choice
        options:
          - "100"
          - "250"
          - "500"
          - "1000"
      fail_on:
        description: Monitor severity that should fail the workflow.
        required: true
        default: critical
        type: choice
        options:
          - critical
          - warning
          - never

concurrency:
  group: scan-media-health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: Production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: qlarqavoqhkuwzmevrmf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Validate monitor secrets
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"

      - name: Load Supabase service-role key
        run: |
          api_keys_json="$(supabase projects api-keys --project-ref "$PROJECT_ID" --output json)"
          service_role_key="$(
            echo "$api_keys_json" | jq -r '
              (if type == "array" then . else (.api_keys // .keys // []) end)[]
              | select((((.name // .key_name // .type // .id // "") | ascii_downcase) == "service_role")
                or (((.name // .key_name // .type // .id // "") | ascii_downcase) | contains("service")))
              | (.api_key // .apiKey // .apikey // .key // .value // empty)
            ' | head -n 1
          )"

          if [ -z "$service_role_key" ] || [ "$service_role_key" = "null" ]; then
            echo "Unable to resolve Supabase service-role key from project API keys."
            exit 1
          fi

          echo "::add-mask::$service_role_key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Run scan media health monitor
        env:
          SUPABASE_URL: https://${{ env.PROJECT_ID }}.supabase.co
          INPUT_LIMIT: ${{ inputs.limit || '25' }}
          INPUT_RECENT_SCAN_LIMIT: ${{ inputs.recent_scan_limit || '250' }}
          INPUT_FAIL_ON: ${{ inputs.fail_on || 'critical' }}
        run: |
          summary_json="${RUNNER_TEMP}/scan-media-health-summary.json"
          summary_md="${RUNNER_TEMP}/scan-media-health-summary.md"
          limit="${INPUT_LIMIT:-25}"
          recent_scan_limit="${INPUT_RECENT_SCAN_LIMIT:-250}"
          fail_on="${INPUT_FAIL_ON:-critical}"

          set +e
          deno run --allow-net --allow-env --allow-write \
            services/supabase/scripts/monitor_scan_media_health.ts \
            --limit "$limit" \
            --recent-scan-limit "$recent_scan_limit" \
            --fail-on "$fail_on" \
            --summary-json "$summary_json" \
            --summary-md "$summary_md"
          exit_code=$?
          set -e

          if [ -f "$summary_md" ]; then
            cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$exit_code"

      - name: Upload scan media health summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-media-health-summary-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/scan-media-health-summary.json
            ${{ runner.temp }}/scan-media-health-summary.md
          if-no-files-found: warn
          retention-days: 30
