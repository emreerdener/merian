name: Scan Media Health Monitor

on:
  schedule:
    # Every 30 minutes. GitHub scheduled jobs may be delayed under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum rows sampled per issue type.
        required: true
        default: "25"
        type: choice
        options:
          - "10"
          - "25"
          - "50"
          - "100"
      recent_scan_limit:
        description: Number of recent scan rows sampled for media drift.
        required: true
        default: "250"
        type: choice
        options:
          - "100"
          - "250"
          - "500"
          - "1000"
      fail_on:
        description: Monitor severity that should fail the workflow.
        required: true
        default: critical
        type: choice
        options:
          - critical
          - warning
          - never

concurrency:
  group: scan-media-health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production

    env:
      PROJECT_ID: qlarqavoqhkuwzmevrmf

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4

      - name: Validate monitor secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"

      - name: Load Supabase server API key
        id: service-role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          resolved_keys_json="$(
            deno run --quiet --frozen \
              --config services/supabase/functions/deno.json \
              --allow-env=SUPABASE_ACCESS_TOKEN \
              --allow-net=api.supabase.com \
              services/supabase/scripts/resolve_project_api_keys.ts \
              --project-ref "$PROJECT_ID"
          )"
          server_api_key="$(
            jq -er '.server_api_key' <<< "$resolved_keys_json"
          )"
          unset resolved_keys_json

          if [ -z "$server_api_key" ] || [ "$server_api_key" = "null" ]; then
            echo "Unable to resolve a Supabase secret or legacy service-role API key."
            exit 1
          fi

          echo "::add-mask::$server_api_key"
          echo "key=$server_api_key" >> "$GITHUB_OUTPUT"

      - name: Run scan media health monitor
        env:
          SUPABASE_SERVER_API_KEY: ${{ steps.service-role.outputs.key }}
          SUPABASE_URL: https://${{ env.PROJECT_ID }}.supabase.co
          INPUT_LIMIT: ${{ inputs.limit || '25' }}
          INPUT_RECENT_SCAN_LIMIT: ${{ inputs.recent_scan_limit || '250' }}
          INPUT_FAIL_ON: ${{ inputs.fail_on || 'critical' }}
        run: |
          summary_json="${RUNNER_TEMP}/scan-media-health-summary.json"
          summary_md="${RUNNER_TEMP}/scan-media-health-summary.md"
          limit="${INPUT_LIMIT:-25}"
          recent_scan_limit="${INPUT_RECENT_SCAN_LIMIT:-250}"
          fail_on="${INPUT_FAIL_ON:-critical}"

          set +e
          deno run --frozen \
            --config services/supabase/functions/deno.json \
            --allow-net="${PROJECT_ID}.supabase.co" \
            --allow-env=SUPABASE_URL,SUPABASE_SERVER_API_KEY,MERIAN_SUPABASE_SERVER_API_KEY,SUPABASE_SECRET_KEYS,SUPABASE_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY \
            --allow-write="$RUNNER_TEMP" \
            services/supabase/scripts/monitor_scan_media_health.ts \
            --limit "$limit" \
            --recent-scan-limit "$recent_scan_limit" \
            --fail-on "$fail_on" \
            --summary-json "$summary_json" \
            --summary-md "$summary_md"
          exit_code=$?
          set -e

          if [ -f "$summary_md" ]; then
            cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$exit_code"

      - name: Upload scan media health summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-media-health-summary-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scan-media-health-summary.json
            ${{ runner.temp }}/scan-media-health-summary.md
          if-no-files-found: warn
          retention-days: 30
