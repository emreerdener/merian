name: iOS Project Guardrails

on:
  pull_request:
    paths:
      - ".github/workflows/ios-project-guardrails.yml"
      - ".github/workflows/ios-build-and-test.yml"
      - ".github/workflows/ios-startup-safety.yml"
      - ".swiftlint.yml"
      - "Config.xcconfig"
      - "Makefile"
      - "Merian.xcodeproj/**"
      - "Signing.xcconfig"
      - "merian.xcodeproj/**"
      - "apps/ios/**"
      - "apps/watch/**"
      - "project.yml"
      - "scripts/check-ios-project-resources.sh"
      - "scripts/check-ios-project-source-membership.sh"
      - "scripts/check-ios-release-prep.sh"
      - "scripts/check-ios-migration-source-guardrails.sh"
      - "scripts/prepare-ios-release.sh"
      - "scripts/ci-detect-startup-safety-source-changes.sh"
      - "scripts/ci-detect-ios-build-source-changes.sh"
      - "scripts/ci-run-summary.sh"
      - "scripts/test-ios-versioning.sh"
      - "scripts/test-ios-project-source-membership.sh"
      - "scripts/test-validate-ios-critical-test-results.sh"
      - "scripts/test-ci-detect-ios-build-source-changes.sh"
      - "scripts/test-ios-build-and-test-workflow.sh"
      - "scripts/validate-ios-critical-test-results.sh"
      - "scripts/validate-ios-versioning.sh"
      - "services/supabase/functions/_shared/identify/contract.ts"
      - "services/supabase/functions/_shared/identify/contract_test.ts"
      - "services/supabase/functions/_shared/identify/schema.ts"
      - "services/supabase/scripts/validate_edge_dto_contract.sh"
      - "services/supabase/scripts/validate_edge_dtos.deno.json"
      - "services/supabase/scripts/validate_edge_dtos.dependencies.lock"
      - "services/supabase/scripts/validate_edge_dtos.ts"
      - "services/supabase/scripts/validate_edge_dtos_test.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-project-guardrails.yml"
      - ".github/workflows/ios-build-and-test.yml"
      - ".github/workflows/ios-startup-safety.yml"
      - ".swiftlint.yml"
      - "Config.xcconfig"
      - "Makefile"
      - "Merian.xcodeproj/**"
      - "Signing.xcconfig"
      - "merian.xcodeproj/**"
      - "apps/ios/**"
      - "apps/watch/**"
      - "project.yml"
      - "scripts/check-ios-project-resources.sh"
      - "scripts/check-ios-project-source-membership.sh"
      - "scripts/check-ios-release-prep.sh"
      - "scripts/check-ios-migration-source-guardrails.sh"
      - "scripts/prepare-ios-release.sh"
      - "scripts/ci-detect-startup-safety-source-changes.sh"
      - "scripts/ci-detect-ios-build-source-changes.sh"
      - "scripts/ci-run-summary.sh"
      - "scripts/test-ios-versioning.sh"
      - "scripts/test-ios-project-source-membership.sh"
      - "scripts/test-validate-ios-critical-test-results.sh"
      - "scripts/test-ci-detect-ios-build-source-changes.sh"
      - "scripts/test-ios-build-and-test-workflow.sh"
      - "scripts/validate-ios-critical-test-results.sh"
      - "scripts/validate-ios-versioning.sh"
      - "services/supabase/functions/_shared/identify/contract.ts"
      - "services/supabase/functions/_shared/identify/contract_test.ts"
      - "services/supabase/functions/_shared/identify/schema.ts"
      - "services/supabase/scripts/validate_edge_dto_contract.sh"
      - "services/supabase/scripts/validate_edge_dtos.deno.json"
      - "services/supabase/scripts/validate_edge_dtos.dependencies.lock"
      - "services/supabase/scripts/validate_edge_dtos.ts"
      - "services/supabase/scripts/validate_edge_dtos_test.ts"
  workflow_dispatch:

concurrency:
  group: ios-project-guardrails-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-generated-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Summarize workflow context
        env:
          WORKFLOW_PURPOSE: "Fast iOS source guardrails: validate generated project resources and migration-source invariants without booting a simulator."
          WORKFLOW_REASON: "This cheap workflow runs on iOS/project/tooling changes so structural mistakes fail before the slower compiled build/test and focused startup-safety lanes."
        run: bash scripts/ci-run-summary.sh

      - name: Validate generated iOS project guardrails
        run: make validate-ios-project

      - name: Validate iOS release versioning guardrails
        run: make validate-ios-versioning

      - name: Validate SwiftData migration source guardrails
        run: make validate-ios-migration-guardrails

      - name: Validate Identify Edge DTO contract
        run: bash services/supabase/scripts/validate_edge_dto_contract.sh

      - name: Test iOS CI tooling contracts
        run: make test-ios-ci-tooling
