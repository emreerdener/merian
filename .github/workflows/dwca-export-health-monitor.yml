name: DwC-A Export and Archive Health Monitor

on:
  schedule:
    # Every five minutes, offset from the once-per-minute dispatcher.
    # GitHub scheduled jobs may be delayed under load.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      warning_after_minutes:
        description: Oldest due age that produces a warning.
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
      critical_after_minutes:
        description: Oldest due age that produces a critical result.
        required: true
        default: "15"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
      warning_backlog:
        description: Outstanding job count that produces a warning.
        required: true
        default: "25"
        type: choice
        options:
          - "10"
          - "25"
          - "50"
      critical_backlog:
        description: Outstanding job count that produces a critical result.
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "250"
      fail_on:
        description: Monitor severity that should fail the workflow.
        required: true
        default: warning
        type: choice
        options:
          - warning
          - critical
          - never

concurrency:
  group: dwca-export-health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production

    env:
      PROJECT_ID: qlarqavoqhkuwzmevrmf

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Validate monitor secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"

      - name: Load Supabase server API key
        id: service-role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          resolved_keys_json="$(
            deno run --quiet --frozen \
              --config services/supabase/functions/deno.json \
              --allow-env=SUPABASE_ACCESS_TOKEN \
              --allow-net=api.supabase.com \
              services/supabase/scripts/resolve_project_api_keys.ts \
              --project-ref "$PROJECT_ID"
          )"
          server_api_key="$(
            jq -er '.server_api_key' <<< "$resolved_keys_json"
          )"
          unset resolved_keys_json

          if [ -z "$server_api_key" ] || [ "$server_api_key" = "null" ]; then
            echo "Unable to resolve a Supabase secret or legacy service-role API key."
            exit 1
          fi

          echo "::add-mask::$server_api_key"
          echo "key=$server_api_key" >> "$GITHUB_OUTPUT"

      - name: Run DwC-A export and archive health monitor
        env:
          SUPABASE_SERVER_API_KEY: ${{ steps.service-role.outputs.key }}
          SUPABASE_URL: https://${{ env.PROJECT_ID }}.supabase.co
          INPUT_WARNING_AFTER_MINUTES: ${{ inputs.warning_after_minutes || '5' }}
          INPUT_CRITICAL_AFTER_MINUTES: ${{ inputs.critical_after_minutes || '15' }}
          INPUT_WARNING_BACKLOG: ${{ inputs.warning_backlog || '25' }}
          INPUT_CRITICAL_BACKLOG: ${{ inputs.critical_backlog || '100' }}
          INPUT_FAIL_ON: ${{ inputs.fail_on || 'warning' }}
        run: |
          summary_json="${RUNNER_TEMP}/dwca-export-health.json"
          summary_md="${RUNNER_TEMP}/dwca-export-health.md"
          warning_after="${INPUT_WARNING_AFTER_MINUTES:-5}"
          critical_after="${INPUT_CRITICAL_AFTER_MINUTES:-15}"
          warning_backlog="${INPUT_WARNING_BACKLOG:-25}"
          critical_backlog="${INPUT_CRITICAL_BACKLOG:-100}"
          fail_on="${INPUT_FAIL_ON:-warning}"

          set +e
          deno run --frozen \
            --config services/supabase/functions/deno.json \
            --allow-net="${PROJECT_ID}.supabase.co" \
            --allow-env=SUPABASE_URL,SUPABASE_SERVER_API_KEY,MERIAN_SUPABASE_SERVER_API_KEY,SUPABASE_SECRET_KEYS,SUPABASE_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY \
            --allow-write="$RUNNER_TEMP" \
            services/supabase/scripts/monitor_dwca_export_queue.ts \
            --warning-after-minutes "$warning_after" \
            --critical-after-minutes "$critical_after" \
            --warning-backlog "$warning_backlog" \
            --critical-backlog "$critical_backlog" \
            --fail-on "$fail_on" \
            --summary-json "$summary_json" \
            --summary-md "$summary_md"
          exit_code=$?
          set -e

          if [ -f "$summary_md" ]; then
            cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$exit_code"

      - name: Upload DwC-A export and archive health summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dwca-export-health-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dwca-export-health.json
            ${{ runner.temp }}/dwca-export-health.md
          if-no-files-found: warn
          retention-days: 30
