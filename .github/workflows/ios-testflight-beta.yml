name: TestFlight Beta

on:
  workflow_dispatch:

# The reusable publisher cannot elevate its caller. This grant is used only to
# push durable iOS allocation, evidence, and upload tags.
permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Archive and upload a new beta
    uses: ./.github/workflows/ios-testflight-publisher.yml
    with:
      action: upload
      external_state_confirmation: "RESERVE BUILD"
      upload_confirmation: "UPLOAD TO APP STORE CONNECT"
    secrets: inherit
