name: Deploy Merian to Supabase

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "scripts/ci-run-summary.sh"
      - "scripts/test-ci-run-summary.sh"
      - "scripts/supabase-db-url.sh"
      - "apps/ios/Merian/Core/AI/InferenceEdgeDTOs.swift"
      - "services/supabase/**"
  workflow_dispatch:

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: services

    env:
      PROJECT_ID: qlarqavoqhkuwzmevrmf
      SUPABASE_DB_POOLER_PORT: ${{ vars.SUPABASE_DB_POOLER_PORT }}
      SUPABASE_DB_NAME: ${{ vars.SUPABASE_DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Deployment plans compare against the last successful production
          # run, which may be more than one commit behind after a failed run.
          fetch-depth: 0

      - name: Summarize workflow context
        env:
          WORKFLOW_PURPOSE: "Production Supabase backend deploy: validate Edge code, push database migrations, deploy functions, and smoke-test production endpoints."
          WORKFLOW_REASON: "This workflow is path-filtered to Supabase backend and deploy-support changes, or manual dispatch. It is intentionally separate from iOS simulator startup safety."
        run: bash ../scripts/ci-run-summary.sh

      - name: Test workflow summary rendering
        run: bash ../scripts/test-ci-run-summary.sh

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.9.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_POOLER_HOST: ${{ secrets.SUPABASE_DB_POOLER_HOST }}
          AI_QUOTA_IP_HASH_SECRET: ${{ secrets.AI_QUOTA_IP_HASH_SECRET }}
          DWCA_PSEUDONYM_HMAC_KEY_V1: ${{ secrets.DWCA_PSEUDONYM_HMAC_KEY_V1 }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET }}
          R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          R2_EVENT_WEBHOOK_SECRET: ${{ secrets.R2_EVENT_WEBHOOK_SECRET }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"
          : "${DWCA_PSEUDONYM_HMAC_KEY_V1:?Missing DWCA_PSEUDONYM_HMAC_KEY_V1 GitHub secret}"
          : "${REVENUECAT_SECRET_API_KEY:?Missing REVENUECAT_SECRET_API_KEY GitHub secret}"
          : "${REVENUECAT_WEBHOOK_SECRET:?Missing REVENUECAT_WEBHOOK_SECRET GitHub secret}"
          : "${REVENUECAT_WEBHOOK_SIGNING_SECRET:?Missing REVENUECAT_WEBHOOK_SIGNING_SECRET GitHub secret}"
          : "${R2_READ_ACCESS_KEY_ID:?Missing R2_READ_ACCESS_KEY_ID GitHub secret}"
          : "${R2_READ_SECRET_ACCESS_KEY:?Missing R2_READ_SECRET_ACCESS_KEY GitHub secret}"
          if [ -n "$AI_QUOTA_IP_HASH_SECRET" ] && [ "${#AI_QUOTA_IP_HASH_SECRET}" -lt 32 ]; then
            echo "AI_QUOTA_IP_HASH_SECRET must contain at least 32 characters." >&2
            exit 1
          fi
          if [ -n "$R2_EVENT_WEBHOOK_SECRET" ] && [ "${#R2_EVENT_WEBHOOK_SECRET}" -lt 32 ]; then
            echo "R2_EVENT_WEBHOOK_SECRET must contain at least 32 characters." >&2
            exit 1
          fi
          if ! printf '%s' "$DWCA_PSEUDONYM_HMAC_KEY_V1" | base64 --decode >/dev/null 2>&1; then
            echo "DWCA_PSEUDONYM_HMAC_KEY_V1 must be valid Base64." >&2
            exit 1
          fi
          dwca_key_bytes="$(
            printf '%s' "$DWCA_PSEUDONYM_HMAC_KEY_V1" |
              base64 --decode |
              wc -c |
              tr -d '[:space:]'
          )"
          if [ "$dwca_key_bytes" -lt 32 ]; then
            echo "DWCA_PSEUDONYM_HMAC_KEY_V1 must decode to at least 32 bytes." >&2
            exit 1
          fi
          if [ "${#REVENUECAT_WEBHOOK_SECRET}" -lt 32 ]; then
            echo "REVENUECAT_WEBHOOK_SECRET must contain at least 32 characters." >&2
            exit 1
          fi
          if [ "${#REVENUECAT_WEBHOOK_SIGNING_SECRET}" -lt 32 ]; then
            echo "REVENUECAT_WEBHOOK_SIGNING_SECRET must contain at least 32 characters." >&2
            exit 1
          fi
          case "$REVENUECAT_SECRET_API_KEY" in
            sk_*)
              ;;
            *)
              echo "REVENUECAT_SECRET_API_KEY must be a RevenueCat secret server key beginning with sk_." >&2
              exit 1
              ;;
          esac
          bash ../scripts/supabase-db-url.sh --require >/dev/null

      - name: Gate whole-tree Supabase formatting
        run: deno fmt --check supabase/functions supabase/scripts

      - name: Gate whole-tree Supabase TypeScript lint
        run: |
          deno lint --config supabase/functions/deno.json \
            supabase/functions \
            supabase/scripts

      - name: Test complete Supabase tooling suite
        run: bash supabase/scripts/test_supabase_tooling.sh

      - name: Validate shared Edge runtime checks
        run: |
          deno check --frozen --config supabase/functions/deno.json \
            supabase/functions/_shared/auth.ts \
            supabase/functions/_shared/claimsAuth.ts \
            supabase/functions/_shared/serviceRoleAuth.ts \
            supabase/functions/_shared/serviceRoleClient.ts \
            supabase/functions/_shared/serviceRoleClient_test.ts \
            supabase/functions/_shared/edgeHandler.ts \
            supabase/functions/_tests/edgeHandler.test.ts \
            supabase/functions/_tests/exportDwcaMigrationContract.test.ts \
            supabase/functions/_tests/exportDwcaSecurityCoverage.test.ts \
            supabase/functions/_tests/workflowSecurity.test.ts \
            supabase/functions/_shared/http.ts \
            supabase/functions/_shared/http_test.ts \
            supabase/functions/_shared/outbound.ts \
            supabase/functions/_shared/outbound_test.ts \
            supabase/functions/_shared/posthog.ts \
            supabase/functions/_shared/external.ts \
            supabase/functions/_shared/external_test.ts \
            supabase/functions/_shared/mediaBudgets.ts \
            supabase/functions/_shared/mediaBudgets_test.ts \
            supabase/functions/_shared/clientAddress.ts \
            supabase/functions/_shared/clientAddress_test.ts \
            supabase/functions/_shared/aiQuota.ts \
            supabase/functions/_shared/groupTagQuota.ts \
            supabase/functions/_shared/aiQuota_test.ts \
            supabase/functions/_shared/entitlement.ts \
            supabase/functions/_shared/entitlement_test.ts \
            supabase/functions/_shared/biology.ts \
            supabase/functions/_shared/gemini.ts \
            supabase/functions/_shared/aws.ts \
            supabase/functions/_shared/aws_test.ts \
            supabase/functions/_shared/concurrency.ts \
            supabase/functions/_shared/concurrency_test.ts \
            supabase/functions/_shared/identify/latencyDb.ts \
            supabase/functions/_shared/identify/latencyDb_test.ts \
            supabase/functions/_shared/scanIngestionCompatibility.ts \
            supabase/functions/_shared/scanIngestionCompatibility_test.ts \
            supabase/functions/_shared/scanIngestionIntents_test.ts \
            supabase/functions/_shared/scanIngestionJobs_test.ts \
            supabase/functions/_shared/scanMediaDeletion.ts \
            supabase/functions/_shared/scanMediaDeletion_test.ts \
            supabase/functions/_shared/audioModeration.ts \
            supabase/functions/_shared/audioModeration_test.ts \
            supabase/functions/_shared/subscriptionPass.ts \
            supabase/functions/_shared/subscriptionPass_test.ts \
            supabase/functions/share-scan-to-explore/index.ts \
            supabase/functions/_tests/accountDeletionCoverage.test.ts \
            supabase/functions/_tests/accountDeletionMigrationContract.test.ts \
            supabase/functions/_tests/aiQuotaCoverage.test.ts \
            supabase/functions/_tests/aiQuotaMigrationContract.test.ts \
            supabase/functions/_tests/auth.test.ts \
            supabase/functions/_tests/exploreMediaQuarantineMigrationContract.test.ts \
            supabase/functions/_tests/jsonEndpointSecurityCoverage.test.ts \
            supabase/functions/_tests/jsonEndpointSecurityMigrationContract.test.ts \
            supabase/functions/_tests/outboundDeadlineCoverage.test.ts \
            supabase/functions/_tests/migrationExecutionContract.test.ts \
            supabase/functions/_tests/migrationMediaContract.test.ts \
            supabase/functions/_tests/privilegedRoutineMigrationContract.test.ts \
            supabase/functions/_tests/serviceRoleAuth.test.ts \
            supabase/functions/_tests/serviceRoleAuthCoverage.test.ts \
            supabase/functions/_tests/serviceRoleAuthMigrationContract.test.ts \
            supabase/functions/_tests/serverApiKeyBoundaryMigrationContract.test.ts \
            supabase/functions/_tests/revenueCatWebhookCoverage.test.ts \
            supabase/functions/_tests/revenueCatWebhookMigrationContract.test.ts \
            supabase/functions/_tests/speciesCountTriggerMigrationContract.test.ts \
            supabase/functions/_tests/speciesObservationStatsCoverage.test.ts \
            supabase/functions/_tests/speciesObservationStatsMigrationContract.test.ts \
            supabase/functions/_tests/scanMediaIngestionContract.test.ts \
            supabase/functions/_tests/safeDelete.test.ts \
            supabase/functions/auto-purge-nonbio/index.ts \
            supabase/functions/delete-scan/index.ts \
            supabase/functions/safe-delete/index.ts \
            supabase/functions/safe-delete/handler.ts \
            supabase/functions/safe-delete/worker.ts \
            supabase/functions/reconcile-account-deletions/index.ts \
            supabase/functions/identify-multimodal/index.ts \
            supabase/functions/identify-multimodal/index.test.ts \
            supabase/functions/update-scan-context/index.ts \
            supabase/functions/get-explore-media-incidents/index.ts \
            supabase/functions/ingest-r2-media-events/index.ts \
            supabase/functions/ingest-r2-media-events/validation_test.ts \
            supabase/functions/reconcile-explore-media-health/index.ts \
            supabase/functions/reconcile-explore-media-health/worker_test.ts \
            supabase/functions/explore-post-chat/index.ts \
            supabase/functions/insight-chat/index.ts \
            supabase/functions/replay-scan-ingestion/index.ts \
            supabase/functions/replay-scan-ingestion/worker_test.ts \
            supabase/functions/send-push-notification/delivery_test.ts \
            supabase/functions/revenuecat-webhook/index.ts \
            supabase/functions/reconcile-revenuecat-subscribers/db_test.ts \
            supabase/functions/reconcile-revenuecat-subscribers/worker_test.ts \
            supabase/functions/species-observation-stats/index.ts \
            supabase/functions/species-observation-stats/db.test.ts \
            supabase/functions/species-observation-stats/security.test.ts \
            supabase/functions/revenuecat-webhook/handler_test.ts \
            supabase/functions/revenuecat-webhook/index_test.ts \
            supabase/functions/revenuecat-webhook/signature_test.ts \
            supabase/functions/revenuecat-webhook/subscriber_test.ts \
            supabase/functions/export-dwca/archive_test.ts \
            supabase/functions/export-dwca/crc32_test.ts \
            supabase/functions/export-dwca/index_test.ts \
            supabase/functions/export-dwca/db_test.ts \
            supabase/functions/export-dwca/mail_test.ts \
            supabase/functions/export-dwca/pseudonym_test.ts \
            supabase/functions/export-dwca/storage_test.ts \
            supabase/functions/export-dwca/worker_test.ts \
            supabase/functions/export-dwca/zip_test.ts \
            supabase/functions/scan-media-health/index.ts

      - name: Validate isolated Edge Function dependency graphs
        run: |
          deno run --frozen --config supabase/functions/deno.json \
            --allow-read=supabase \
            supabase/scripts/sync_function_deno_configs.ts --check

          deno run --frozen --config supabase/functions/deno.json \
            --allow-read=supabase \
            supabase/scripts/validate_function_dependencies.ts

          checked=0
          for entrypoint in supabase/functions/*/index.ts; do
            function_dir="${entrypoint%/index.ts}"
            deno check --frozen \
              --config "$function_dir/deno.json" \
              "$entrypoint"
            checked=$((checked + 1))
          done
          echo "Checked $checked Edge Function entrypoints with deploy-time configs."

      - name: Test shared Edge helpers
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-env \
            --allow-read=supabase/functions,../apps/web \
            supabase/functions/_shared/http_test.ts \
            supabase/functions/_shared/outbound_test.ts \
            supabase/functions/_shared/external_test.ts \
            supabase/functions/_tests/edgeHandler.test.ts \
            supabase/functions/_tests/jsonEndpointSecurityCoverage.test.ts \
            supabase/functions/_tests/outboundDeadlineCoverage.test.ts \
            supabase/functions/_shared/aws_test.ts \
            supabase/functions/_shared/concurrency_test.ts \
            supabase/functions/_shared/identify/latencyDb_test.ts \
            supabase/functions/_shared/scanIngestionCompatibility_test.ts \
            supabase/functions/_shared/scanIngestionIntents_test.ts \
            supabase/functions/_shared/scanIngestionJobs_test.ts \
            supabase/functions/_shared/scanMediaDeletion_test.ts \
            supabase/functions/_shared/clientAddress_test.ts \
            supabase/functions/_shared/audioModeration_test.ts \
            supabase/functions/share-scan-to-explore/audioModeration_test.ts \
            supabase/functions/identify-multimodal/index.test.ts \
            supabase/functions/replay-scan-ingestion/worker_test.ts \
            supabase/functions/send-push-notification/delivery_test.ts \
            supabase/functions/search-community-taxa/gbif.test.ts \
            supabase/functions/sync-community-taxonomy-index/gbif.test.ts \
            supabase/functions/ingest-r2-media-events/validation_test.ts \
            supabase/functions/reconcile-explore-media-health/worker_test.ts \
            supabase/functions/sync-collections/db_test.ts \
            supabase/functions/_tests/auth.test.ts \
            supabase/functions/_tests/scanMediaIngestionContract.test.ts \
            supabase/functions/explore-post-chat/prompt_test.ts \
            supabase/functions/insight-chat/guards_test.ts \
            supabase/functions/insight-chat/prompt_test.ts \
            supabase/functions/scan-media-health/health_test.ts

      - name: Test internal service credential boundary
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/functions,supabase/migrations,supabase/scripts,../.github/workflows \
            supabase/functions/_shared/serviceRoleClient_test.ts \
            supabase/functions/_tests/serviceRoleAuth.test.ts \
            supabase/functions/_tests/serviceRoleAuthCoverage.test.ts \
            supabase/functions/_tests/serviceRoleAuthMigrationContract.test.ts \
            supabase/functions/_tests/serverApiKeyBoundaryMigrationContract.test.ts

      - name: Test durable account deletion boundary
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/functions,supabase/migrations,supabase/scripts,supabase/tests/account_deletion_security.sql,supabase/config.toml,../.github/workflows \
            supabase/functions/_tests/safeDelete.test.ts \
            supabase/functions/_tests/accountDeletionCoverage.test.ts \
            supabase/functions/_tests/accountDeletionMigrationContract.test.ts

      - name: Test public species observation stats boundary
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/functions,supabase/migrations,supabase/config.toml \
            supabase/functions/_shared/mediaBudgets_test.ts \
            supabase/functions/species-observation-stats/db.test.ts \
            supabase/functions/species-observation-stats/security.test.ts \
            supabase/functions/_tests/speciesObservationStatsCoverage.test.ts \
            supabase/functions/_tests/speciesObservationStatsMigrationContract.test.ts

      - name: Validate authoritative AI quota coverage
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/functions,../.github/workflows/deploy.yml \
            supabase/functions/_shared/aiQuota_test.ts \
            supabase/functions/_shared/entitlement_test.ts \
            supabase/functions/_tests/aiQuotaCoverage.test.ts

      - name: Test RevenueCat webhook boundary
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/functions,supabase/scripts,supabase/config.toml,../.github/workflows \
            supabase/functions/_tests/revenueCatWebhookCoverage.test.ts \
            supabase/functions/_shared/subscriptionPass_test.ts \
            supabase/functions/revenuecat-webhook/handler_test.ts \
            supabase/functions/revenuecat-webhook/index_test.ts \
            supabase/functions/revenuecat-webhook/signature_test.ts \
            supabase/functions/revenuecat-webhook/subscriber_test.ts \
            supabase/functions/reconcile-revenuecat-subscribers/db_test.ts \
            supabase/functions/reconcile-revenuecat-subscribers/worker_test.ts

      - name: Test Darwin Core export boundary
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/functions,supabase/migrations,supabase/scripts,../.github/workflows \
            supabase/functions/_tests/exportDwcaMigrationContract.test.ts \
            supabase/functions/_tests/exportDwcaSecurityCoverage.test.ts \
            supabase/functions/export-dwca/archive_test.ts \
            supabase/functions/export-dwca/crc32_test.ts \
            supabase/functions/export-dwca/db_test.ts \
            supabase/functions/export-dwca/drain_test.ts \
            supabase/functions/export-dwca/index_test.ts \
            supabase/functions/export-dwca/mail_test.ts \
            supabase/functions/export-dwca/pseudonym_test.ts \
            supabase/functions/export-dwca/storage_test.ts \
            supabase/functions/export-dwca/worker_test.ts \
            supabase/functions/export-dwca/zip_test.ts

      - name: Test production workflow security
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=../.github/workflows \
            supabase/functions/_tests/workflowSecurity.test.ts

      - name: Validate Supabase migration contracts
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/migrations \
            supabase/functions/_tests/accountDeletionMigrationContract.test.ts \
            supabase/functions/_tests/aiQuotaMigrationContract.test.ts \
            supabase/functions/_tests/exportDwcaMigrationContract.test.ts \
            supabase/functions/_tests/exploreMediaQuarantineMigrationContract.test.ts \
            supabase/functions/_tests/explorePostChatMigration.test.ts \
            supabase/functions/_tests/jsonEndpointSecurityMigrationContract.test.ts \
            supabase/functions/_tests/migrationExecutionContract.test.ts \
            supabase/functions/_tests/migrationMediaContract.test.ts \
            supabase/functions/_tests/privilegedRoutineMigrationContract.test.ts \
            supabase/functions/_tests/revenueCatWebhookMigrationContract.test.ts \
            supabase/functions/_tests/serviceRoleAuthMigrationContract.test.ts \
            supabase/functions/_tests/speciesCountTriggerMigrationContract.test.ts \
            supabase/functions/_tests/speciesObservationStatsMigrationContract.test.ts

      - name: Start disposable database for privileged-routine validation
        env:
          # config.toml keeps Apple auth available for local integration tests,
          # but schema-only CI does not need a real OAuth client secret.
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-schema-validation-placeholder
        run: supabase db start

      - name: Validate database security catalogs
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: bash supabase/scripts/test_database_catalogs.sh

      - name: Test complete Edge Function suite
        env:
          SUPABASE_DB_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: deno task --config supabase/functions/deno.json test

      - name: Stop disposable database
        if: always()
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: supabase stop --no-backup

      - name: Plan affected Edge Function deployment
        id: function-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          plan_file="$RUNNER_TEMP/merian-supabase-functions.txt"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            deno run --frozen --config supabase/functions/deno.json \
              --allow-read=supabase \
              supabase/scripts/plan_function_deploy.ts \
              --all > "$plan_file"
          else
            successful_runs_url="https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1"
            successful_runs_json="$(
              curl -fsSL --retry 3 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$successful_runs_url" || true
            )"
            last_success_sha="$(
              jq -r '.workflow_runs[0].head_sha // empty' \
                <<< "$successful_runs_json" 2>/dev/null || true
            )"

            if [[ "$last_success_sha" =~ ^[0-9a-f]{40}$ ]] && \
               git merge-base --is-ancestor "$last_success_sha" "$HEAD_SHA"; then
              echo "Planning from last successful production deploy: $last_success_sha"
              deno run --frozen --config supabase/functions/deno.json \
                --allow-read=supabase \
                --allow-run=git \
                supabase/scripts/plan_function_deploy.ts \
                --base "$last_success_sha" \
                --head "$HEAD_SHA" > "$plan_file"
            else
              echo "Unable to resolve a safe successful deploy baseline; planning a full deployment."
              deno run --frozen --config supabase/functions/deno.json \
                --allow-read=supabase \
                supabase/scripts/plan_function_deploy.ts \
                --all > "$plan_file"
            fi
          fi

          function_count="$(grep -cve '^[[:space:]]*$' "$plan_file" || true)"
          echo "plan_file=$plan_file" >> "$GITHUB_OUTPUT"
          echo "count=$function_count" >> "$GITHUB_OUTPUT"

          {
            echo "### Edge Function deployment plan"
            echo
            echo "Functions selected: $function_count"
            if [ "$function_count" -gt 0 ]; then
              sed 's/^/- /' "$plan_file"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare database connection URL
        id: database-url
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_POOLER_HOST: ${{ secrets.SUPABASE_DB_POOLER_HOST }}
        run: |
          db_url="$(bash ../scripts/supabase-db-url.sh --require)"

          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "Using SUPABASE_DB_URL secret for migration push."
          else
            echo "Using SUPABASE_DB_POOLER_HOST and SUPABASE_DB_PASSWORD secrets for migration push."
          fi

          echo "::add-mask::$db_url"
          echo "url=$db_url" >> "$GITHUB_OUTPUT"

      - name: Audit production privileged routine ACLs before migration
        env:
          SUPABASE_DB_PUSH_URL: ${{ steps.database-url.outputs.url }}
        run: |
          MERIAN_DATABASE_URL="$SUPABASE_DB_PUSH_URL" \
            deno run --frozen --config supabase/functions/deno.json \
              --allow-env \
              --allow-net \
              supabase/scripts/audit_privileged_routine_acl.ts \
              --report

      - name: Push Database Migrations
        env:
          SUPABASE_DB_PUSH_URL: ${{ steps.database-url.outputs.url }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: supabase db push --db-url "$SUPABASE_DB_PUSH_URL"

      - name: Enforce production privileged routine ACLs
        env:
          SUPABASE_DB_PUSH_URL: ${{ steps.database-url.outputs.url }}
        run: |
          MERIAN_DATABASE_URL="$SUPABASE_DB_PUSH_URL" \
            deno run --frozen --config supabase/functions/deno.json \
              --allow-env \
              --allow-net \
              supabase/scripts/audit_privileged_routine_acl.ts \
              --enforce

      - name: Synchronize optional AI quota hashing override
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AI_QUOTA_IP_HASH_SECRET: ${{ secrets.AI_QUOTA_IP_HASH_SECRET }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          if [ -n "$AI_QUOTA_IP_HASH_SECRET" ]; then
            supabase secrets set \
              "AI_QUOTA_IP_HASH_SECRET=$AI_QUOTA_IP_HASH_SECRET" \
              --project-ref "$PROJECT_ID"
          else
            echo "Using the built-in server key for domain-separated AI quota IP hashing."
          fi

      - name: Synchronize RevenueCat webhook secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          supabase secrets set \
            "REVENUECAT_SECRET_API_KEY=$REVENUECAT_SECRET_API_KEY" \
            "REVENUECAT_WEBHOOK_SECRET=$REVENUECAT_WEBHOOK_SECRET" \
            "REVENUECAT_WEBHOOK_SIGNING_SECRET=$REVENUECAT_WEBHOOK_SIGNING_SECRET" \
            --project-ref "$PROJECT_ID"

      - name: Synchronize Darwin Core pseudonym key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DWCA_PSEUDONYM_HMAC_KEY_V1: ${{ secrets.DWCA_PSEUDONYM_HMAC_KEY_V1 }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          supabase secrets set \
            "DWCA_PSEUDONYM_HMAC_KEY_V1=$DWCA_PSEUDONYM_HMAC_KEY_V1" \
            --project-ref "$PROJECT_ID"

      - name: Synchronize optional R2 event webhook secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R2_EVENT_WEBHOOK_SECRET: ${{ secrets.R2_EVENT_WEBHOOK_SECRET }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          if [ -n "$R2_EVENT_WEBHOOK_SECRET" ]; then
            supabase secrets set \
              "R2_EVENT_WEBHOOK_SECRET=$R2_EVENT_WEBHOOK_SECRET" \
              --project-ref "$PROJECT_ID"
          else
            echo "R2 event acceleration is disabled; scheduled origin reconciliation remains authoritative."
          fi

      - name: Synchronize read-only R2 credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          supabase secrets set \
            "R2_READ_ACCESS_KEY_ID=$R2_READ_ACCESS_KEY_ID" \
            "R2_READ_SECRET_ACCESS_KEY=$R2_READ_SECRET_ACCESS_KEY" \
            --project-ref "$PROJECT_ID"

      - name: Load Supabase API keys for authorization smoke tests
        id: service-role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          resolved_keys_json="$(
            deno run --quiet --frozen \
              --config supabase/functions/deno.json \
              --allow-env=SUPABASE_ACCESS_TOKEN \
              --allow-net=api.supabase.com \
              supabase/scripts/resolve_project_api_keys.ts \
              --project-ref "$PROJECT_ID"
          )"
          server_api_key="$(
            jq -er '.server_api_key' <<< "$resolved_keys_json"
          )"

          if [ -z "$server_api_key" ] || [ "$server_api_key" = "null" ]; then
            echo "Unable to resolve a Supabase secret or legacy service-role API key."
            exit 1
          fi

          public_api_keys_json="$(
            jq -ce '.public_api_keys' <<< "$resolved_keys_json"
          )"
          unset resolved_keys_json
          if [ "$(echo "$public_api_keys_json" | jq 'length')" -lt 1 ]; then
            echo "Unable to resolve an anon or publishable key for the negative authorization smoke test."
            exit 1
          fi
          echo "$public_api_keys_json" > "$RUNNER_TEMP/supabase-public-api-keys.json"

          echo "::add-mask::$server_api_key"
          echo "key=$server_api_key" >> "$GITHUB_OUTPUT"

      - name: Deploy affected Edge Functions
        if: steps.function-plan.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          bash supabase/scripts/deploy_function_batches.sh \
            "${{ steps.function-plan.outputs.plan_file }}" \
            "$PROJECT_ID"

      - name: Confirm no Edge Function deploy is required
        if: steps.function-plan.outputs.count == '0'
        run: echo "No Edge Function runtime or dependency changes were detected."

      - name: Smoke test production backend endpoints
        env:
          SUPABASE_SERVER_API_KEY: ${{ steps.service-role.outputs.key }}
        run: |
          supabase_url="https://${PROJECT_ID}.supabase.co"
          server_headers=(
            -H "apikey: ${SUPABASE_SERVER_API_KEY}"
            -H "Content-Type: application/json"
          )
          if [[ "$SUPABASE_SERVER_API_KEY" != sb_secret_* ]]; then
            server_headers+=(
              -H "Authorization: Bearer ${SUPABASE_SERVER_API_KEY}"
            )
          fi
          smoke_response_file="$RUNNER_TEMP/supabase-production-smoke-response.json"

          post_server_json() {
            local endpoint="$1"
            local payload="$2"
            local status
            if ! status="$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 60 \
                -o "$smoke_response_file" \
                -w "%{http_code}" \
                -X POST "${supabase_url}${endpoint}" \
                "${server_headers[@]}" \
                --data "$payload"
            )"; then
              echo "Production smoke request could not reach ${endpoint}." >&2
              return 1
            fi
            if ! [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Production smoke request ${endpoint} returned HTTP ${status}." >&2
              jq -c \
                'if type == "object" then {error, code, request_id, debug} else {error: "Non-object response"} end' \
                "$smoke_response_file" >&2 2>/dev/null || true
              return 1
            fi
            cat "$smoke_response_file"
          }

          public_key_count="$(jq 'length' "$RUNNER_TEMP/supabase-public-api-keys.json")"
          for ((index = 0; index < public_key_count; index++)); do
            public_key="$(
              jq -r ".[$index]" "$RUNNER_TEMP/supabase-public-api-keys.json"
            )"
            public_headers=(
              -H "apikey: ${public_key}"
              -H "Content-Type: application/json"
            )
            if [[ "$public_key" != sb_publishable_* ]]; then
              public_headers+=(-H "Authorization: Bearer ${public_key}")
            fi

            denied_response="$RUNNER_TEMP/service-role-auth-denied-${index}.json"
            denied_status="$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 60 \
                -o "$denied_response" \
                -w "%{http_code}" \
                -X POST "${supabase_url}/functions/v1/community-taxonomy-status" \
                "${public_headers[@]}" \
                --data '{"view":"coverage","target":"birds","import_run_limit":1,"job_limit":1}'
            )"
            if [ "$denied_status" != "401" ]; then
              echo "A public Supabase API credential unexpectedly passed the internal-route authorization boundary (HTTP ${denied_status})."
              exit 1
            fi
          done

          status_response="$(
            post_server_json \
              "/functions/v1/community-taxonomy-status" \
              '{"view":"coverage","target":"birds","import_run_limit":3,"job_limit":1}'
          )"
          echo "$status_response" | jq -e '.success == true and .view == "coverage" and (.coverage_targets | length) >= 1'

          dry_run_response="$(
            post_server_json \
              "/functions/v1/sync-community-taxonomy-index" \
              '{"target":"birds","limit":5,"page_count":1,"dry_run":true}'
          )"
          echo "$dry_run_response" | jq -e '.success == true and .dry_run == true and .normalized_count > 0'

          media_health_response="$(
            post_server_json \
              "/functions/v1/scan-media-health" \
              '{"limit":10,"recent_scan_limit":100}'
          )"
          echo "$media_health_response" | jq -e '.success == true and (.status == "ok" or .status == "warning" or .status == "critical")'
          echo "$media_health_response" | jq '{status, counts}'

          explore_media_response="$(
            post_server_json \
              "/functions/v1/reconcile-explore-media-health" \
              '{"limit":1,"leaseSeconds":300}'
          )"
          echo "$explore_media_response" | jq -e '
            .success == true
            and (.claimed | type) == "number"
            and (.errors | type) == "array"
          '

          publication_health_response="$(
            post_server_json \
              "/rest/v1/rpc/get_explore_publication_health_summary" \
              '{}'
          )"
          echo "$publication_health_response" | jq -e '
            type == "array"
            and length == 1
            and (.[0].active_publication_count | type) == "number"
            and (.[0].healthy_post_count | type) == "number"
            and (.[0].degraded_post_count | type) == "number"
            and (.[0].affected_author_count | type) == "number"
            and (.[0].quarantined_post_count | type) == "number"
            and (.[0].missing_media_item_count | type) == "number"
          '
          echo "$publication_health_response" | jq '.[0]'

          owned_incidents_response="$(
            post_server_json \
              "/rest/v1/rpc/get_owned_explore_media_incidents" \
              '{"self_id":"00000000-0000-0000-0000-000000000000"}'
          )"
          echo "$owned_incidents_response" | jq -e 'type == "array"'
