            supabase/functions/_tests/edgeHandler.test.ts \
            supabase/functions/_tests/dwcaLaunchGateCoverage.test.ts \
            supabase/functions/_tests/dwcaDownloadAndScanFinalizationMigrationContract.test.ts \
            supabase/functions/_tests/exportDwcaMigrationContract.test.ts \
