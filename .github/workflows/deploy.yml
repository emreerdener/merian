      - name: Test production workflow security
        run: |
          deno test --frozen --config supabase/functions/deno.json \
            --allow-read=supabase/functions/deno.json,../.github/workflows \
            supabase/functions/_tests/workflowSecurity.test.ts

      - name: Validate Supabase migration contracts
        run: bash supabase/scripts/validate_migration_contracts.sh

      - name: Start disposable database for privileged-routine validation
        env:
          # config.toml keeps Apple auth available for local integration tests,
          # but schema-only CI does not need a real OAuth client secret.
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-schema-validation-placeholder
        run: supabase db start

      - name: Validate database security catalogs
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: bash supabase/scripts/test_database_catalogs.sh

      - name: Test complete Edge Function suite
        env:
          SUPABASE_DB_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: deno task --config supabase/functions/deno.json test

      - name: Validate database lint and advisors
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          supabase db lint --local --schema public,internal \
            --level warning --fail-on warning
          # Advisor warnings include reviewed historical debt. Keep them in the
          # run log, but block only on errors until that debt has an explicit
          # baseline or has been retired.
          supabase db advisors --local --type security \
            --level warn --fail-on error
          supabase db advisors --local --type performance \
            --level warn --fail-on error

      - name: Stop disposable database
        if: always()
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: supabase stop --no-backup

      - name: Plan affected Edge Function deployment
        id: function-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          plan_file="$RUNNER_TEMP/merian-supabase-functions.txt"
          recovery_predeploy_required=false
          ghost_merge_predeploy_required=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            recovery_predeploy_required=true
            ghost_merge_predeploy_required=true
            deno run --frozen --config supabase/functions/deno.json \
              --allow-read=supabase \
              supabase/scripts/plan_function_deploy.ts \
              --all > "$plan_file"
          else
            successful_runs_url="https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1"
            successful_runs_json="$(
              curl -fsSL \
                --connect-timeout 10 \
                --max-time 30 \
                --max-filesize 1048576 \
                --retry 3 \
                --retry-all-errors \
                --retry-delay 2 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$successful_runs_url" || true
            )"
            last_success_sha="$(
              jq -r '.workflow_runs[0].head_sha // empty' \
                <<< "$successful_runs_json" 2>/dev/null || true
            )"

            if [[ "$last_success_sha" =~ ^[0-9a-f]{40}$ ]] && \
               git merge-base --is-ancestor "$last_success_sha" "$HEAD_SHA"; then
              echo "Planning from last successful production deploy: $last_success_sha"
              if ! git diff --quiet "$last_success_sha" "$HEAD_SHA" -- \
                ":(top)services/supabase/migrations/20260729173000_recover_media_abandoned_owned_scans.sql" \
                ":(top)services/supabase/migrations/20260729200000_harden_media_abandoned_scan_recovery_proof.sql"; then
                recovery_predeploy_required=true
              fi
              if ! git diff --quiet "$last_success_sha" "$HEAD_SHA" -- \
                ":(glob,top)services/supabase/migrations/*ghost*merge*.sql" \
                ":(top)services/supabase/functions/merge-ghost-profile" \
                ":(top)services/supabase/functions/reconcile-ghost-profile-merges"; then
                ghost_merge_predeploy_required=true
              fi
              deno run --frozen --config supabase/functions/deno.json \
                --allow-read=supabase \
                --allow-run=git \
                supabase/scripts/plan_function_deploy.ts \
                --base "$last_success_sha" \
                --head "$HEAD_SHA" > "$plan_file"
            else
              echo "Unable to resolve a safe successful deploy baseline; planning a full deployment."
              recovery_predeploy_required=true
              ghost_merge_predeploy_required=true
              deno run --frozen --config supabase/functions/deno.json \
                --allow-read=supabase \
                supabase/scripts/plan_function_deploy.ts \
                --all > "$plan_file"
            fi
          fi

          function_count="$(grep -cve '^[[:space:]]*$' "$plan_file" || true)"
          echo "plan_file=$plan_file" >> "$GITHUB_OUTPUT"
          echo "count=$function_count" >> "$GITHUB_OUTPUT"
          echo "recovery_predeploy_required=$recovery_predeploy_required" >> "$GITHUB_OUTPUT"
          echo "ghost_merge_predeploy_required=$ghost_merge_predeploy_required" >> "$GITHUB_OUTPUT"

          {
            echo "### Edge Function deployment plan"
            echo
            echo "Functions selected: $function_count"
            echo "Fail-closed recovery consumer predeploy: $recovery_predeploy_required"
            echo "Ghost merge compatibility predeploy: $ghost_merge_predeploy_required"
            if [ "$function_count" -gt 0 ]; then
              sed 's/^/- /' "$plan_file"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record Ghost merge disposable-CI proof
        if: steps.function-plan.outputs.ghost_merge_predeploy_required == 'true'
        run: |
          {
            echo "### Ghost merge release proof"
            echo
            echo "The exact release SHA passed the disposable database replay, complete catalog and Edge suites, two-session concurrency tests, strict database lint, and advisors in this job."
            echo "No hosted staging project or operator-managed SHA variable is required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare database connection URL
        id: database-url
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_POOLER_HOST: ${{ secrets.SUPABASE_DB_POOLER_HOST }}
        run: |
          db_url="$(bash ../scripts/supabase-db-url.sh --require)"

          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "Using SUPABASE_DB_URL secret for migration push."
          else
            echo "Using SUPABASE_DB_POOLER_HOST and SUPABASE_DB_PASSWORD secrets for migration push."
          fi

          echo "::add-mask::$db_url"
          echo "url=$db_url" >> "$GITHUB_OUTPUT"

      - name: Deploy fail-closed recovery consumers before compatibility migrations
        if: steps.function-plan.outputs.recovery_predeploy_required == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          pre_migration_plan="$RUNNER_TEMP/merian-recovery-consumers.txt"
          printf '%s\n' \
