name: Deploy Merian to Supabase

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "scripts/supabase-db-url.sh"
      - "services/supabase/**"
  workflow_dispatch:

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: services

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: qlarqavoqhkuwzmevrmf
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_POOLER_HOST: ${{ secrets.SUPABASE_DB_POOLER_HOST }}
      SUPABASE_DB_POOLER_PORT: ${{ vars.SUPABASE_DB_POOLER_PORT }}
      SUPABASE_DB_NAME: ${{ vars.SUPABASE_DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Summarize workflow context
        env:
          WORKFLOW_PURPOSE: "Production Supabase backend deploy: validate Edge code, push database migrations, deploy functions, and smoke-test production endpoints."
          WORKFLOW_REASON: "This workflow is path-filtered to Supabase backend and deploy-support changes, or manual dispatch. It is intentionally separate from iOS simulator startup safety."
        run: bash ../scripts/ci-run-summary.sh

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Validate deployment secrets
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"
          bash ../scripts/supabase-db-url.sh --require >/dev/null

      - name: Validate Edge Function formatting
        run: |
          deno fmt --check \
            supabase/functions/_shared/auth.ts \
            supabase/functions/_shared/edgeHandler.ts \
            supabase/functions/_shared/http.ts \
            supabase/functions/_shared/aws.ts \
            supabase/functions/_shared/aws_test.ts \
            supabase/functions/_shared/concurrency.ts \
            supabase/functions/_shared/concurrency_test.ts \
            supabase/functions/_shared/identify/latencyDb.ts \
            supabase/functions/_shared/identify/latencyDb_test.ts \
            supabase/functions/_shared/scanIngestionCompatibility.ts \
            supabase/functions/_shared/scanIngestionCompatibility_test.ts \
            supabase/functions/_shared/scanIngestionIntents_test.ts \
            supabase/functions/_shared/scanIngestionJobs_test.ts \
            supabase/functions/_shared/scanMediaDeletion.ts \
            supabase/functions/_shared/scanMediaDeletion_test.ts \
            supabase/functions/_shared/audioModeration.ts \
            supabase/functions/_shared/audioModeration_test.ts \
            supabase/functions/share-scan-to-explore/audioModeration_test.ts \
            supabase/functions/_tests/auth.test.ts \
            supabase/functions/_tests/migrationMediaContract.test.ts \
            supabase/functions/_tests/scanMediaIngestionContract.test.ts \
            supabase/scripts/monitor_scan_media_health.ts \
            supabase/scripts/monitor_scan_media_health_test.ts \
            supabase/functions/auto-purge-nonbio/index.ts \
            supabase/functions/identify-multimodal/index.ts \
            supabase/functions/identify-multimodal/index.test.ts \
            supabase/functions/update-scan-context/index.ts \
            supabase/functions/insight-chat \
            supabase/functions/scan-media-health

      - name: Validate Edge Function lint
        run: |
          deno lint --config supabase/functions/deno.json \
            supabase/functions/_shared/auth.ts \
            supabase/functions/_shared/edgeHandler.ts \
            supabase/functions/_shared/http.ts \
            supabase/functions/_shared/aws.ts \
            supabase/functions/_shared/aws_test.ts \
            supabase/functions/_shared/concurrency.ts \
            supabase/functions/_shared/concurrency_test.ts \
            supabase/functions/_shared/identify/latencyDb.ts \
            supabase/functions/_shared/identify/latencyDb_test.ts \
            supabase/functions/_shared/scanIngestionCompatibility.ts \
            supabase/functions/_shared/scanIngestionCompatibility_test.ts \
            supabase/functions/_shared/scanIngestionIntents_test.ts \
            supabase/functions/_shared/scanIngestionJobs_test.ts \
            supabase/functions/_shared/scanMediaDeletion.ts \
            supabase/functions/_shared/scanMediaDeletion_test.ts \
            supabase/functions/_shared/audioModeration.ts \
            supabase/functions/_shared/audioModeration_test.ts \
            supabase/functions/share-scan-to-explore/audioModeration_test.ts \
            supabase/functions/_tests/auth.test.ts \
            supabase/functions/_tests/migrationMediaContract.test.ts \
            supabase/functions/_tests/scanMediaIngestionContract.test.ts \
            supabase/scripts/monitor_scan_media_health.ts \
            supabase/scripts/monitor_scan_media_health_test.ts \
            supabase/functions/auto-purge-nonbio/index.ts \
            supabase/functions/delete-scan/index.ts \
            supabase/functions/identify-multimodal/index.ts \
            supabase/functions/identify-multimodal/index.test.ts \
            supabase/functions/update-scan-context/index.ts \
            supabase/functions/insight-chat \
            supabase/functions/scan-media-health

      - name: Validate shared Edge runtime checks
        run: |
          deno check --config supabase/functions/deno.json \
            supabase/functions/_shared/auth.ts \
            supabase/functions/_shared/edgeHandler.ts \
            supabase/functions/_shared/http.ts \
            supabase/functions/_shared/aws.ts \
            supabase/functions/_shared/aws_test.ts \
            supabase/functions/_shared/concurrency.ts \
            supabase/functions/_shared/concurrency_test.ts \
            supabase/functions/_shared/identify/latencyDb.ts \
            supabase/functions/_shared/identify/latencyDb_test.ts \
            supabase/functions/_shared/scanIngestionCompatibility.ts \
            supabase/functions/_shared/scanIngestionCompatibility_test.ts \
            supabase/functions/_shared/scanIngestionIntents_test.ts \
            supabase/functions/_shared/scanIngestionJobs_test.ts \
            supabase/functions/_shared/scanMediaDeletion.ts \
            supabase/functions/_shared/scanMediaDeletion_test.ts \
            supabase/functions/_shared/audioModeration.ts \
            supabase/functions/_shared/audioModeration_test.ts \
            supabase/functions/share-scan-to-explore/index.ts \
            supabase/functions/_tests/auth.test.ts \
            supabase/functions/_tests/migrationMediaContract.test.ts \
            supabase/functions/_tests/scanMediaIngestionContract.test.ts \
            supabase/scripts/monitor_scan_media_health.ts \
            supabase/scripts/monitor_scan_media_health_test.ts \
            supabase/functions/auto-purge-nonbio/index.ts \
            supabase/functions/delete-scan/index.ts \
            supabase/functions/identify-multimodal/index.ts \
            supabase/functions/identify-multimodal/index.test.ts \
            supabase/functions/update-scan-context/index.ts \
            supabase/functions/insight-chat/index.ts \
            supabase/functions/scan-media-health/index.ts

      - name: Test shared Edge helpers
        run: |
          deno test --config supabase/functions/deno.json \
            --allow-read=supabase/functions/identify-multimodal/index.ts \
            supabase/functions/_shared/aws_test.ts \
            supabase/functions/_shared/concurrency_test.ts \
            supabase/functions/_shared/identify/latencyDb_test.ts \
            supabase/functions/_shared/scanIngestionCompatibility_test.ts \
            supabase/functions/_shared/scanIngestionIntents_test.ts \
            supabase/functions/_shared/scanIngestionJobs_test.ts \
            supabase/functions/_shared/scanMediaDeletion_test.ts \
            supabase/functions/_shared/audioModeration_test.ts \
            supabase/functions/share-scan-to-explore/audioModeration_test.ts \
            supabase/functions/identify-multimodal/index.test.ts \
            supabase/functions/_tests/auth.test.ts \
            supabase/functions/_tests/scanMediaIngestionContract.test.ts \
            supabase/scripts/monitor_scan_media_health_test.ts \
            supabase/functions/insight-chat/guards_test.ts \
            supabase/functions/insight-chat/prompt_test.ts \
            supabase/functions/scan-media-health/health_test.ts

      - name: Validate Supabase migration contracts
        run: |
          deno test --config supabase/functions/deno.json \
            --allow-read=supabase/migrations \
            supabase/functions/_tests/migrationMediaContract.test.ts

      - name: Prepare database connection URL
        run: |
          db_url="$(bash ../scripts/supabase-db-url.sh --require)"

          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "Using SUPABASE_DB_URL secret for migration push."
          elif [ -n "${SUPABASE_DB_PUSH_URL:-}" ]; then
            echo "Using SUPABASE_DB_PUSH_URL environment value for migration push."
          else
            echo "Using SUPABASE_DB_POOLER_HOST and SUPABASE_DB_PASSWORD secrets for migration push."
          fi

          echo "::add-mask::$db_url"
          {
            echo "SUPABASE_DB_PUSH_URL<<EOF"
            echo "$db_url"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Push Database Migrations
        run: supabase db push --db-url "$SUPABASE_DB_PUSH_URL"

      - name: Deploy Edge Functions
        run: |
          for attempt in 1 2 3; do
            if supabase functions deploy --project-ref "$PROJECT_ID"; then
              exit 0
            fi

            if [ "$attempt" = "3" ]; then
              echo "Supabase Edge Function deploy failed after $attempt attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 20))
            echo "Supabase Edge Function deploy failed; retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Load Supabase service-role key
        run: |
          api_keys_json="$(supabase projects api-keys --project-ref "$PROJECT_ID" --output json)"
          service_role_key="$(
            echo "$api_keys_json" | jq -r '
              (if type == "array" then . else (.api_keys // .keys // []) end)[]
              | select((((.name // .key_name // .type // .id // "") | ascii_downcase) == "service_role")
                or (((.name // .key_name // .type // .id // "") | ascii_downcase) | contains("service")))
              | (.api_key // .apiKey // .apikey // .key // .value // empty)
            ' | head -n 1
          )"

          if [ -z "$service_role_key" ] || [ "$service_role_key" = "null" ]; then
            echo "Unable to resolve Supabase service-role key from project API keys."
            exit 1
          fi

          echo "::add-mask::$service_role_key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Smoke test Community Taxonomy endpoints
        run: |
          supabase_url="https://${PROJECT_ID}.supabase.co"

          status_response="$(
            curl -fsS \
              -X POST "${supabase_url}/functions/v1/community-taxonomy-status" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"view":"coverage","target":"birds","import_run_limit":3,"job_limit":1}'
          )"
          echo "$status_response" | jq -e '.success == true and .view == "coverage" and (.coverage_targets | length) >= 1'

          dry_run_response="$(
            curl -fsS \
              -X POST "${supabase_url}/functions/v1/sync-community-taxonomy-index" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"target":"birds","limit":5,"page_count":1,"dry_run":true}'
          )"
          echo "$dry_run_response" | jq -e '.success == true and .dry_run == true and .normalized_count > 0'

          media_health_response="$(
            curl -fsS \
              -X POST "${supabase_url}/functions/v1/scan-media-health" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"limit":10,"recent_scan_limit":100}'
          )"
          echo "$media_health_response" | jq -e '.success == true and (.status == "ok" or .status == "warning" or .status == "critical")'
          echo "$media_health_response" | jq '{status, counts}'
