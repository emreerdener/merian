          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          if [ -n "$R2_EVENT_WEBHOOK_SECRET" ]; then
            supabase secrets set \
              "R2_EVENT_WEBHOOK_SECRET=$R2_EVENT_WEBHOOK_SECRET" \
              --project-ref "$PROJECT_ID"
          else
            echo "R2 event acceleration is disabled; scheduled origin reconciliation remains authoritative."
          fi

      - name: Synchronize read-only R2 credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          supabase secrets set \
            "R2_READ_ACCESS_KEY_ID=$R2_READ_ACCESS_KEY_ID" \
            "R2_READ_SECRET_ACCESS_KEY=$R2_READ_SECRET_ACCESS_KEY" \
            --project-ref "$PROJECT_ID"

      - name: Load Supabase API keys for authorization smoke tests
        id: service-role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          resolved_keys_json="$(
            deno run --quiet --frozen \
              --config supabase/functions/deno.json \
              --allow-env=SUPABASE_ACCESS_TOKEN \
              --allow-net=api.supabase.com \
              supabase/scripts/resolve_project_api_keys.ts \
              --project-ref "$PROJECT_ID"
          )"
          server_api_key="$(
            jq -er '.server_api_key' <<< "$resolved_keys_json"
          )"

          if [ -z "$server_api_key" ] || [ "$server_api_key" = "null" ]; then
            echo "Unable to resolve a Supabase secret or legacy service-role API key."
            exit 1
          fi

          public_api_keys_json="$(
            jq -ce '.public_api_keys' <<< "$resolved_keys_json"
          )"
          unset resolved_keys_json
          if [ "$(echo "$public_api_keys_json" | jq 'length')" -lt 1 ]; then
            echo "Unable to resolve an anon or publishable key for the negative authorization smoke test."
            exit 1
          fi
          echo "$public_api_keys_json" > "$RUNNER_TEMP/supabase-public-api-keys.json"

          echo "::add-mask::$server_api_key"
          echo "key=$server_api_key" >> "$GITHUB_OUTPUT"

      - name: Synchronize active server API key to Edge fallback
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MERIAN_SUPABASE_SERVER_API_KEY: ${{ steps.service-role.outputs.key }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          : "${MERIAN_SUPABASE_SERVER_API_KEY:?Unable to synchronize the active server API key}"
          supabase secrets set \
            "MERIAN_SUPABASE_SERVER_API_KEY=$MERIAN_SUPABASE_SERVER_API_KEY" \
            --project-ref "$PROJECT_ID"
          supabase secrets list \
            --project-ref "$PROJECT_ID" \
            --output json |
            deno run --quiet --frozen \
              --config supabase/functions/deno.json \
              --allow-env=MERIAN_SUPABASE_SERVER_API_KEY \
              supabase/scripts/verify_edge_secret_digest.ts \
              --secret-name MERIAN_SUPABASE_SERVER_API_KEY

      - name: Deploy affected Edge Functions
        if: steps.function-plan.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-config-parse-placeholder
        run: |
          bash supabase/scripts/deploy_function_batches.sh \
            "${{ steps.function-plan.outputs.plan_file }}" \
            "$PROJECT_ID"

      - name: Confirm no Edge Function deploy is required
        if: steps.function-plan.outputs.count == '0'
        run: echo "No Edge Function runtime or dependency changes were detected."

      - name: Smoke test production backend endpoints
        env:
          SUPABASE_SERVER_API_KEY: ${{ steps.service-role.outputs.key }}
        run: |
          supabase_url="https://${PROJECT_ID}.supabase.co"
          server_headers=(
            -H "Content-Type: application/json"
            -H "apikey: ${SUPABASE_SERVER_API_KEY}"
          )
          if [[ "$SUPABASE_SERVER_API_KEY" != sb_secret_* ]]; then
            server_headers+=(
              -H "Authorization: Bearer ${SUPABASE_SERVER_API_KEY}"
            )
          fi
          smoke_response_file="$RUNNER_TEMP/supabase-production-smoke-response.json"
          smoke_header_file="$RUNNER_TEMP/supabase-production-smoke-headers.txt"
          smoke_max_attempts=6

          is_retryable_smoke_status() {
            case "$1" in
              401 | 404 | 429 | 500 | 502 | 503 | 504)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          post_server_json() {
            local endpoint="$1"
            local payload="$2"
            local status
            local attempt
            local delay

            for ((attempt = 1; attempt <= smoke_max_attempts; attempt++)); do
              : > "$smoke_header_file"
              : > "$smoke_response_file"
              if status="$(
                curl -sS \
                  --connect-timeout 10 \
                  --max-time 60 \
                  --max-filesize 1048576 \
                  --dump-header "$smoke_header_file" \
                  -o "$smoke_response_file" \
                  -w "%{http_code}" \
                  -X POST "${supabase_url}${endpoint}" \
                  "${server_headers[@]}" \
                  --data "$payload"
              )"; then
                if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                  cat "$smoke_response_file"
                  return 0
                fi
                if ! is_retryable_smoke_status "$status" ||
                  [ "$attempt" -eq "$smoke_max_attempts" ]; then
                  break
                fi
                delay=$((attempt * 2))
                echo "Production smoke request ${endpoint} returned HTTP ${status}; waiting ${delay}s for deployment propagation (attempt ${attempt}/${smoke_max_attempts})." >&2
              else
                status="network_error"
                if [ "$attempt" -eq "$smoke_max_attempts" ]; then
                  break
                fi
                delay=$((attempt * 2))
                echo "Production smoke request could not reach ${endpoint}; retrying in ${delay}s (attempt ${attempt}/${smoke_max_attempts})." >&2
              fi
              sleep "$delay"
            done

            if [ "$status" = "network_error" ]; then
              echo "Production smoke request could not reach ${endpoint} after ${attempt} attempts." >&2
            else
              echo "Production smoke request ${endpoint} returned HTTP ${status} after ${attempt} attempts." >&2
              case "$endpoint" in
                /functions/v1/*)
                  if grep -Eqi '^x-merian-handler:[[:space:]]*1[[:space:]]*$' "$smoke_header_file"; then
                    echo "The response reached a Merian Edge handler; inspect its structured authorization event." >&2
                  else
                    echo "The fixed Merian handler marker was absent; inspect the Supabase gateway and Function deployment router." >&2
                  fi
                  ;;
                /rest/v1/*)
                  echo "This request targeted the Data API; inspect the API gateway, PostgREST RPC grants, and database logs." >&2
                  ;;
                *)
                  echo "Inspect the Supabase gateway and endpoint-specific service logs." >&2
                  ;;
              esac
            fi
            echo "Response body withheld because internal endpoints may contain sensitive operational data." >&2
            return 1
          }

          probe_server_rpc_validation_boundary() {
            local rpc_name="$1"
            local payload="$2"
            local expected_message="$3"
            local endpoint="/rest/v1/rpc/${rpc_name}"
            local rpc_validation_response_file="$RUNNER_TEMP/${rpc_name}-validation-response.json"
            local rpc_probe_max_attempts=18
            local status="network_error"
            local attempt
            local delay

            for ((attempt = 1; attempt <= rpc_probe_max_attempts; attempt++)); do
              : > "$rpc_validation_response_file"
              if status="$(
                curl -sS \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --max-filesize 1048576 \
                  -o "$rpc_validation_response_file" \
                  -w "%{http_code}" \
                  -X POST "${supabase_url}${endpoint}" \
                  "${server_headers[@]}" \
                  --data "$payload"
              )"; then
                if [ "$status" = "400" ] &&
                  jq -e \
                    --arg expected_message "$expected_message" \
                    '.code == "22023" and .message == $expected_message' \
                    "$rpc_validation_response_file" > /dev/null; then
                  echo "Confirmed production RPC ${rpc_name} reaches its no-write validation boundary."
                  return 0
                fi
              else
                status="network_error"
              fi

              case "$status" in
                network_error | 404 | 429 | 500 | 502 | 503 | 504)
                  ;;
                *)
                  break
                  ;;
              esac
              if [ "$attempt" -eq "$rpc_probe_max_attempts" ]; then
                break
              fi
              delay=$((attempt * 2))
              if [ "$delay" -gt 10 ]; then
                delay=10
              fi
              echo "Production RPC ${rpc_name} was not ready (HTTP ${status}); retrying in ${delay}s (attempt ${attempt}/${rpc_probe_max_attempts})." >&2
              sleep "$delay"
            done

            echo "Production RPC ${rpc_name} did not reach its exact no-write validation boundary after ${attempt} attempts (HTTP ${status})." >&2
            echo "Inspect the Data API schema cache, routine grant, and database logs; response bodies and request identifiers are intentionally withheld." >&2
            return 1
          }

          probe_user_function_route() {
            local function_name="$1"
            local endpoint="/functions/v1/${function_name}"
            local route_smoke_max_attempts=18
            local status="network_error"
            local attempt
            local delay

            for ((attempt = 1; attempt <= route_smoke_max_attempts; attempt++)); do
              : > "$smoke_header_file"
              if status="$(
                curl -sS \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --max-filesize 1048576 \
                  --dump-header "$smoke_header_file" \
                  -o /dev/null \
                  -w "%{http_code}" \
                  -X POST "${supabase_url}${endpoint}" \
                  -H "Content-Type: application/json" \
                  --data '{}'
              )"; then
                if [ "$status" = "401" ] &&
                  grep -Eqi '^x-merian-handler:[[:space:]]*1[[:space:]]*$' "$smoke_header_file"; then
                  echo "Confirmed production route ${function_name} reaches its fail-closed Merian handler."
                  return 0
                fi
              else
                status="network_error"
              fi

              if [ "$attempt" -eq "$route_smoke_max_attempts" ]; then
                break
              fi
              delay=$((attempt * 2))
              if [ "$delay" -gt 10 ]; then
                delay=10
              fi
              echo "Critical production route ${function_name} was not ready (HTTP ${status}); retrying in ${delay}s (attempt ${attempt}/${route_smoke_max_attempts})." >&2
              sleep "$delay"
            done

            echo "Critical production route ${function_name} did not reach a fail-closed Merian handler after ${attempt} attempts (HTTP ${status})." >&2
            echo "Inspect the Supabase Function deployment router; response body and request identifiers are intentionally withheld." >&2
            return 1
          }

          probe_all_function_routes() {
            local function_plan_file="$RUNNER_TEMP/supabase-all-functions.txt"
            local route_smoke_max_attempts=18
            local -a pending_functions
            local -a next_pending_functions
            local function_name
            local endpoint
            local status
            local attempt
            local delay
            local total_function_count
            local route_probe_jwt
            local -a route_probe_headers

            deno run --quiet --frozen \
              --config supabase/functions/deno.json \
              --allow-read=supabase/functions \
              supabase/scripts/plan_function_deploy.ts \
              --all > "$function_plan_file"
            mapfile -t pending_functions < "$function_plan_file"
            if [ "${#pending_functions[@]}" -eq 0 ]; then
              echo "The canonical Edge Function inventory was unexpectedly empty." >&2
              return 1
            fi
            total_function_count="${#pending_functions[@]}"

            route_probe_jwt="$(
              jq -r \
                'map(select(startswith("sb_publishable_") | not)) | first // empty' \
                "$RUNNER_TEMP/supabase-public-api-keys.json"
            )"
            if grep -Eq \
              '^[[:space:]]*verify_jwt[[:space:]]*=[[:space:]]*true([[:space:]]*(#.*)?)?$' \
              supabase/config.toml &&
              [ -z "$route_probe_jwt" ]; then
              echo "A configured gateway-verified route requires a legacy anon JWT for the handler-execution preflight." >&2
              echo "A publishable API key is never valid Bearer authorization." >&2
              return 1
            fi
            route_probe_headers=(
              -H "Origin: https://naturebook.app"
              -H "Access-Control-Request-Method: POST"
            )
            if [ -n "$route_probe_jwt" ]; then
              route_probe_headers+=(
                -H "apikey: ${route_probe_jwt}"
                -H "Authorization: Bearer ${route_probe_jwt}"
              )
            fi

            for ((attempt = 1; attempt <= route_smoke_max_attempts; attempt++)); do
              next_pending_functions=()
              for function_name in "${pending_functions[@]}"; do
                endpoint="/functions/v1/${function_name}"
                : > "$smoke_header_file"
                if status="$(
                  curl -sS \
                    --connect-timeout 10 \
                    --max-time 30 \
                    --max-filesize 1048576 \
                    --dump-header "$smoke_header_file" \
                    -o /dev/null \
                    -w "%{http_code}" \
                    -X OPTIONS "${supabase_url}${endpoint}" \
                    "${route_probe_headers[@]}"
                )" &&
                  grep -Eqi '^x-merian-handler:[[:space:]]*1[[:space:]]*$' "$smoke_header_file"; then
                  continue
                fi
                next_pending_functions+=("${function_name}:${status:-network_error}")
              done

              if [ "${#next_pending_functions[@]}" -eq 0 ]; then
                echo "Confirmed all ${total_function_count} production Edge routes reach Merian handlers."
                return 0
              fi
              if [ "$attempt" -eq "$route_smoke_max_attempts" ]; then
                break
              fi

              pending_functions=()
              for function_name in "${next_pending_functions[@]}"; do
                pending_functions+=("${function_name%%:*}")
              done
              delay=$((attempt * 2))
              if [ "$delay" -gt 10 ]; then
                delay=10
              fi
              echo "${#pending_functions[@]} production Edge routes were not ready; retrying in ${delay}s (attempt ${attempt}/${route_smoke_max_attempts})." >&2
              sleep "$delay"
            done

            echo "Production Edge route verification failed after ${attempt} attempts:" >&2
            printf '  %s\n' "${next_pending_functions[@]}" >&2
            echo "Inspect the Supabase Function deployment router; response bodies and request identifiers are intentionally withheld." >&2
            return 1
          }

          probe_all_function_routes

          critical_user_functions=(
            generate-upload-urls
            identify-multimodal
            check-scan-status
            share-scan-to-explore
            get-scan-explore-share-state
            get-explore-composer-media
            get-explore-media-incidents
            insight-chat
            explore-post-chat
            request-community-identification
            transfer-signout-purchases
            delete-scan
          )
          for function_name in "${critical_user_functions[@]}"; do
            probe_user_function_route "$function_name"
          done

          probe_server_rpc_validation_boundary \
            "ensure_scan_user_profile" \
            '{"p_user_id":"00000000-0000-0000-0000-000000000000"}' \
            "scan_user_profile_invalid_user"
          probe_server_rpc_validation_boundary \
            "publish_scan_to_explore_atomically" \
            '{"p_scan_id":"00000000-0000-0000-0000-000000000000","p_user_id":"00000000-0000-0000-0000-000000000000","p_species_common_name":null,"p_field_notes":null,"p_location_sharing":null,"p_media_rows":[],"p_hashtags":[]}' \
            "Explore media count is outside the supported range"
          probe_server_rpc_validation_boundary \
            "request_community_identification_atomically" \
            '{"p_scan_id":null,"p_user_id":null,"p_note":null,"p_location_sharing":null,"p_species_common_name":null,"p_media_rows":[],"p_initial_taxon_node_id":null,"p_taxonomy_version_id":null}' \
            "Community request identifiers are required"
          probe_server_rpc_validation_boundary \
            "recover_missing_owned_scan" \
            '{"p_scan_id":null,"p_user_id":null,"p_recovery_scan":null}' \
            "invalid_scan_recovery"
          probe_server_rpc_validation_boundary \
            "get_media_abandoned_scan_recovery_proofs" \
            '{"p_user_id":null,"p_scan_ids":null}' \
            "invalid_media_abandoned_recovery_proof_request"
          probe_server_rpc_validation_boundary \
            "reserve_field_chat_send" \
            '{"p_user_id":null,"p_conversation_id":null,"p_subject_type":null,"p_subject_id":null,"p_message_text":null,"p_client_message_id":null}' \
            "field_chat_invalid_request"
          probe_server_rpc_validation_boundary \
            "recover_stale_field_chat_quota" \
            '{"p_user_id":null,"p_operation":null,"p_request_id":null,"p_conversation_id":null,"p_subject_id":null}' \
            "field_chat_invalid_recovery_request"
          probe_server_rpc_validation_boundary \
            "issue_signout_purchase_handoff" \
            '{"p_source_user_id":null,"p_secret_hash":null,"p_source_snapshot_at_ms":null,"p_expected_store_tier":null,"p_expected_store_expires_at":null}' \
            "signout_handoff_invalid_source"
          probe_server_rpc_validation_boundary \
            "complete_signout_purchase_handoff" \
            '{"p_handoff_id":null,"p_secret_hash":null,"p_destination_user_id":null,"p_destination_snapshot_at_ms":null,"p_destination_store_tier":null,"p_destination_store_expires_at":null}' \
            "signout_handoff_invalid"
          probe_server_rpc_validation_boundary \
            "claim_revenuecat_reconciliation_for_user" \
            '{"p_user_id":null}' \
            "revenuecat_invalid_reconciliation_user"

          signout_health_response="$(
            post_server_json \
              "/rest/v1/rpc/get_revenuecat_reconciliation_health" \
              '{}'
          )"
          echo "$signout_health_response" | jq -e '
            length == 1
            and (.[0].signout_prepared_count | type) == "number"
            and (.[0].signout_bound_count | type) == "number"
            and (
              .[0].oldest_signout_pending_age_seconds == null
              or (.[0].oldest_signout_pending_age_seconds | type) == "number"
            )
          ' > /dev/null

          critical_service_rpc_names=(
            ensure_scan_user_profile
            publish_scan_to_explore_atomically
            request_community_identification_atomically
            recover_missing_owned_scan
            get_media_abandoned_scan_recovery_proofs
            reserve_field_chat_send
            recover_stale_field_chat_quota
            issue_signout_purchase_handoff
            complete_signout_purchase_handoff
            claim_revenuecat_reconciliation_for_user
            get_revenuecat_reconciliation_health
          )
          critical_service_rpc_payloads=(
            '{"p_user_id":"00000000-0000-0000-0000-000000000000"}'
            '{"p_scan_id":"00000000-0000-0000-0000-000000000000","p_user_id":"00000000-0000-0000-0000-000000000000","p_species_common_name":null,"p_field_notes":null,"p_location_sharing":null,"p_media_rows":[],"p_hashtags":[]}'
            '{"p_scan_id":null,"p_user_id":null,"p_note":null,"p_location_sharing":null,"p_species_common_name":null,"p_media_rows":[],"p_initial_taxon_node_id":null,"p_taxonomy_version_id":null}'
            '{"p_scan_id":null,"p_user_id":null,"p_recovery_scan":null}'
            '{"p_user_id":null,"p_scan_ids":null}'
            '{"p_user_id":null,"p_conversation_id":null,"p_subject_type":null,"p_subject_id":null,"p_message_text":null,"p_client_message_id":null}'
            '{"p_user_id":null,"p_operation":null,"p_request_id":null,"p_conversation_id":null,"p_subject_id":null}'
            '{"p_source_user_id":null,"p_secret_hash":null,"p_source_snapshot_at_ms":null,"p_expected_store_tier":null,"p_expected_store_expires_at":null}'
            '{"p_handoff_id":null,"p_secret_hash":null,"p_destination_user_id":null,"p_destination_snapshot_at_ms":null,"p_destination_store_tier":null,"p_destination_store_expires_at":null}'
            '{"p_user_id":null}'
            '{}'
          )
          public_key_count="$(jq 'length' "$RUNNER_TEMP/supabase-public-api-keys.json")"
          for ((index = 0; index < public_key_count; index++)); do
            public_key="$(
              jq -r ".[$index]" "$RUNNER_TEMP/supabase-public-api-keys.json"
            )"
            public_headers=(
              -H "apikey: ${public_key}"
              -H "Content-Type: application/json"
            )
            if [[ "$public_key" != sb_publishable_* ]]; then
              public_headers+=(-H "Authorization: Bearer ${public_key}")
            fi

            for ((rpc_index = 0; rpc_index < ${#critical_service_rpc_names[@]}; rpc_index++)); do
              critical_rpc_name="${critical_service_rpc_names[$rpc_index]}"
              critical_rpc_denied_status="$(
                curl -sS \
                  --connect-timeout 10 \
                  --max-time 60 \
                  --max-filesize 1048576 \
                  -o /dev/null \
                  -w "%{http_code}" \
                  -X POST "${supabase_url}/rest/v1/rpc/${critical_rpc_name}" \
                  "${public_headers[@]}" \
                  --data "${critical_service_rpc_payloads[$rpc_index]}"
              )"
              case "$critical_rpc_denied_status" in
                401 | 403 | 404)
                  ;;
                *)
                  echo "A public Supabase API credential unexpectedly reached the service-only ${critical_rpc_name} validation boundary (HTTP ${critical_rpc_denied_status})."
                  exit 1
                  ;;
              esac
            done

            denied_response="$RUNNER_TEMP/service-role-auth-denied-${index}.json"
            denied_status="$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 60 \
                --max-filesize 1048576 \
                -o "$denied_response" \
                -w "%{http_code}" \
                -X POST "${supabase_url}/functions/v1/community-taxonomy-status" \
                "${public_headers[@]}" \
                --data '{"view":"coverage","target":"birds","import_run_limit":1,"job_limit":1}'
            )"
            if [ "$denied_status" != "401" ]; then
              echo "A public Supabase API credential unexpectedly passed the internal-route authorization boundary (HTTP ${denied_status})."
              exit 1
            fi

            explore_denied_response="$RUNNER_TEMP/public-web-explore-rpc-denied-${index}.json"
            explore_denied_status="$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 60 \
                --max-filesize 1048576 \
                -o "$explore_denied_response" \
                -w "%{http_code}" \
                -X POST "${supabase_url}/rest/v1/rpc/get_public_web_explore_posts" \
                "${public_headers[@]}" \
                --data '{"p_target_post_id":null,"p_max_limit":1}'
            )"
            case "$explore_denied_status" in
              401 | 403 | 404)
                ;;
              *)
                echo "A public Supabase API credential unexpectedly executed the server-only public-web Explore projection (HTTP ${explore_denied_status})."
                exit 1
                ;;
            esac

            explore_page_denied_response="$RUNNER_TEMP/public-web-explore-page-rpc-denied-${index}.json"
            explore_page_denied_status="$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 60 \
                --max-filesize 1048576 \
                -o "$explore_page_denied_response" \
                -w "%{http_code}" \
                -X POST "${supabase_url}/rest/v1/rpc/get_public_web_explore_post_page" \
                "${public_headers[@]}" \
                --data '{"p_target_post_id":"00000000-0000-0000-0000-000000000000"}'
            )"
            case "$explore_page_denied_status" in
              401 | 403 | 404)
                ;;
              *)
                echo "A public Supabase API credential unexpectedly executed the atomic public-web Explore page projection (HTTP ${explore_page_denied_status})."
                exit 1
                ;;
            esac
          done

          status_response="$(
            post_server_json \
              "/functions/v1/community-taxonomy-status" \
              '{"view":"coverage","target":"birds","import_run_limit":3,"job_limit":1}'
          )"
          echo "$status_response" | jq -e '.success == true and .view == "coverage" and (.coverage_targets | length) >= 1'

          dry_run_response="$(
            post_server_json \
              "/functions/v1/sync-community-taxonomy-index" \
              '{"target":"birds","limit":5,"page_count":1,"dry_run":true}'
          )"
          echo "$dry_run_response" | jq -e '.success == true and .dry_run == true and .normalized_count > 0'

          media_health_response="$(
            post_server_json \
              "/functions/v1/scan-media-health" \
              '{"limit":10,"recent_scan_limit":100}'
          )"
          echo "$media_health_response" | jq -e '.success == true and (.status == "ok" or .status == "warning" or .status == "critical")'
          echo "$media_health_response" | jq '{status, counts}'

          scan_deletion_response="$(
            post_server_json \
              "/functions/v1/reconcile-scan-deletions" \
              '{}'
          )"
          echo "$scan_deletion_response" | jq -e '
            .success == true
            and (.claimed | type) == "number"
            and (.completed | type) == "number"
            and (.deferred | type) == "number"
            and (
              .health_status == "healthy"
              or .health_status == "warning"
            )
          '
          echo "$scan_deletion_response" | jq \
            '{claimed, completed, deferred, health_status}'

          dwca_cleanup_response="$(
            post_server_json \
              "/functions/v1/reconcile-dwca-archive-cleanup" \
              '{}'
          )"
          echo "$dwca_cleanup_response" | jq -e '
            .success == true
            and (.claimed | type) == "number"
            and (.completed | type) == "number"
            and (.deferred | type) == "number"
            and (
              .health_status == "healthy"
              or .health_status == "warning"
            )
          '
          echo "$dwca_cleanup_response" | jq \
            '{claimed, completed, deferred, health_status}'

          dwca_gate_response="$(
            post_server_json \
              "/functions/v1/export-dwca" \
              '{}'
          )"
          echo "$dwca_gate_response" | jq -e '
            .success == true
            and .disposition == "disabled"
            and .release.enabled == false
          '
          echo "$dwca_gate_response" | jq \
            '{disposition, release}'

          explore_media_response="$(
            post_server_json \
              "/functions/v1/reconcile-explore-media-health" \
              '{"limit":1,"leaseSeconds":300}'
          )"
          echo "$explore_media_response" | jq -e '
            .success == true
            and (.claimed | type) == "number"
            and (.errors | type) == "array"
          '

          publication_health_response="$(
            post_server_json \
              "/rest/v1/rpc/get_explore_publication_health_summary" \
              '{}'
          )"
          echo "$publication_health_response" | jq -e '
            type == "array"
            and length == 1
            and (.[0].active_publication_count | type) == "number"
            and (.[0].healthy_post_count | type) == "number"
            and (.[0].degraded_post_count | type) == "number"
            and (.[0].affected_author_count | type) == "number"
            and (.[0].quarantined_post_count | type) == "number"
            and (.[0].missing_media_item_count | type) == "number"
          '
          echo "$publication_health_response" | jq '.[0]'

          public_web_explore_response="$(
            post_server_json \
              "/rest/v1/rpc/get_public_web_explore_posts" \
              '{"p_target_post_id":null,"p_max_limit":1}'
          )"
          echo "$public_web_explore_response" | jq -e '
            type == "array"
            and length <= 1
            and all(
              .[];
              (.post_id | type) == "string"
              and (.scan_id | type) == "string"
              and .like_count == 0
              and .comment_count == 0
              and .viewer_has_liked == false
              and .is_owned_by_viewer == false
            )
          '
          public_web_post_id="$(
            echo "$public_web_explore_response" | jq -r '.[0].post_id // empty'
          )"
          if [ -n "$public_web_post_id" ]; then
            public_web_page_response="$(
              post_server_json \
                "/rest/v1/rpc/get_public_web_explore_post_page" \
                "$(jq -cn --arg post_id "$public_web_post_id" \
                  '{p_target_post_id:$post_id}')"
            )"
            echo "$public_web_page_response" | jq -e \
              --arg post_id "$public_web_post_id" '
              type == "array"
              and length == 1
              and .[0].post_payload.post_id == $post_id
              and (
                .[0].detail_payload == null
                or .[0].detail_payload.post_id == $post_id
              )
            '
          fi

          owned_incidents_response="$(
            post_server_json \
              "/rest/v1/rpc/get_owned_explore_media_incidents" \
              '{"self_id":"00000000-0000-0000-0000-000000000000"}'
          )"
          echo "$owned_incidents_response" | jq -e 'type == "array"'

      - name: Audit Ghost merge health after deployment
        env:
          MERIAN_DATABASE_URL: ${{ steps.database-url.outputs.url }}
        run: |
          database_network_scope="$(
            bash supabase/scripts/deno_postgres_net_scope.sh
          )"

          summary_md="${RUNNER_TEMP}/ghost-profile-merge-health-postdeploy.md"
          deno run --frozen \
            --config supabase/functions/deno.json \
            --allow-net="$database_network_scope" \
            --allow-env="MERIAN_DATABASE_URL,PG*" \
            --allow-write="$RUNNER_TEMP" \
            supabase/scripts/monitor_ghost_profile_merges.ts \
            --cleanup-warning-after-minutes 20 \
            --cleanup-critical-after-minutes 60 \
            --fail-on warning \
            --summary-md "$summary_md"
          unset database_network_scope
          cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"
