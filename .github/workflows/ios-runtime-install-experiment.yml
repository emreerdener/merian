name: iOS Runtime Installation Experiment

on:
  # Isolated setup evidence, never a required release check.
  push:
    branches:
      - codex/pr152-simulator-diagnostics-20261114

permissions:
  contents: read

jobs:
  export-runtime:
    name: Export exact Apple runtime on source runner
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.transfer.outputs.artifact-id }}
      artifact_digest: ${{ steps.transfer.outputs.artifact-digest }}
      tar_sha256: ${{ steps.export.outputs.tar_sha256 }}
      source_sha: ${{ steps.export.outputs.source_sha }}
      run_id: ${{ steps.export.outputs.run_id }}
      run_attempt: ${{ steps.export.outputs.run_attempt }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Checkout exact experiment SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and pinned Xcode
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code --quiet
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 27.0'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 27A266a'
      - name: Export and package the exact runtime
        id: export
        timeout-minutes: 10
        run: python3 -B scripts/experiment-ios-runtime-import.py export --evidence "$RUNNER_TEMP/runtime-export-receipt.json"
      - name: Transfer intact bundle to fresh runner
        id: transfer
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/runtime-export-${{ github.run_id }}-attempt-${{ github.run_attempt }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Retain export receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-export-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-export-receipt.json
          if-no-files-found: error
          retention-days: 14

  import-runtime:
    name: Import and qualify runtime on fresh runner
    needs: export-runtime
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      EXPORT_ARTIFACT_ID: ${{ needs.export-runtime.outputs.artifact_id }}
      EXPORT_ARTIFACT_DIGEST: ${{ needs.export-runtime.outputs.artifact_digest }}
      EXPORT_TAR_SHA256: ${{ needs.export-runtime.outputs.tar_sha256 }}
      EXPORT_SOURCE_SHA: ${{ needs.export-runtime.outputs.source_sha }}
      EXPORT_RUN_ID: ${{ needs.export-runtime.outputs.run_id }}
      EXPORT_RUN_ATTEMPT: ${{ needs.export-runtime.outputs.run_attempt }}
    steps:
      - name: Checkout exact experiment SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and pinned Xcode
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code --quiet
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 27.0'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 27A266a'
      - name: Download exact producer artifact
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.export-runtime.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          skip-decompress: true
          path: ${{ runner.temp }}/runtime-input
      - name: Verify transfer and unpack into fresh directory
        timeout-minutes: 5
        run: python3 -B scripts/experiment-ios-runtime-import.py unpack --evidence "$RUNNER_TEMP/runtime-unpack-receipt.json"
      - name: Import and qualify the required simulator
        timeout-minutes: 25
        run: python3 -B scripts/experiment-ios-runtime-import.py qualify --evidence "$RUNNER_TEMP/runtime-import-receipt.json"
      - name: Retain setup-only outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-import-receipts-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-unpack-receipt.json
            ${{ runner.temp }}/runtime-import-receipt.json
          if-no-files-found: error
          retention-days: 14
