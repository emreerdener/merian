name: iOS Runtime Installation Experiment

on:
  # An isolated, one-purpose experiment; never a required release check.
  push:
    branches:
      - codex/pr152-simulator-diagnostics-20261114

permissions:
  contents: read

jobs:
  exported-runtime:
    name: Qualify exported runtime installation
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Checkout exact experiment SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify experiment source and toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code --quiet
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 27.0'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 27A266a'
      - name: Export, import and qualify the required simulator
        timeout-minutes: 25
        run: python3 -B scripts/experiment-ios-runtime-import.py --evidence "$RUNNER_TEMP/runtime-install-experiment.json"
      - name: Retain setup-only outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-install-experiment-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-install-experiment.json
          if-no-files-found: error
          retention-days: 14
