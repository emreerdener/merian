      config: Debug
      environmentVariables:
        UITesting: "true"
        UITestKeychainNamespace: "a955c80c-8472-54bb-aaed-9df9bb752fa0"
      commandLineArguments:
        "-skipOnboarding": true
        "-seedCurrentRequiredConsent": true
        "-seedLocationPermissionPromptSuppressed": true
        "-mockCameraFeed": true
        "-hasCompletedOnboarding YES": true
        "-seedPublicationConsentChooser": true

  # Guided synthetic device review; no live history installation or rollout.
  Merian Device - Species Name:
