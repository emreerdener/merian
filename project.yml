name: Merian
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 199
    VERSIONING_SYSTEM: apple-generic
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Apple Distribution"

options:
  bundleIdPrefix: app.merian
  deploymentTarget:
    iOS: 17.2
    macOS: 14.0

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.64.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.47.0
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.41.1
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftClient.git
    from: 2.9.4
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios.git
    from: 6.16.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.1.0

targets:
  Merian:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources: [apps/ios/Merian]
    entitlements:
      path: apps/ios/Merian/Configuration/Merian.entitlements
      properties:
        com.apple.developer.applesignin: ["Default"]
        com.apple.security.application-groups: ["group.app.merian.shared"]
        keychain-access-groups: ["$(AppIdentifierPrefix)app.merian.shared"]
        com.apple.developer.weatherkit: true
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        INFOPLIST_FILE: apps/ios/Merian/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1" # iPhone Only to bypass iPad Multitasking requirements
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: MerianExploreWidget
        embed: true
      - target: MerianMessagesExtension
        embed: true
      - target: MerianShareExtension
        embed: true
      - target: MerianWatch # Natively bundles the companion watchApp binary directly into the parent iPhone executable
        embed: true
      - package: RevenueCat
      - package: PostHog
      - package: Supabase
      - product: TelemetryClient
        package: TelemetryDeck
      - package: RiveRuntime
      - package: GoogleSignIn
    postBuildScripts:
      - name: SwiftLint Validation
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed locally. Run 'brew install swiftlint' to enable automated static analysis."
          fi

  MerianWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [apps/watch/MerianWatch]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.merian.Merian
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleIconFiles: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  MerianExploreWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - apps/ios/widgets/Explore
      - apps/ios/Merian/Features/Explore/Widgets/ExploreWidgetCache.swift
    entitlements:
      path: apps/ios/widgets/Explore/Configuration/MerianExploreWidget.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.merian.shared"]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.ExploreWidget
        INFOPLIST_FILE: apps/ios/widgets/Explore/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  MerianMessagesExtension:
    type: app-extension.messages
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - apps/ios/messages/MerianMessagesExtension
      - apps/ios/Merian/Features/Messages/MessageScanShareCache.swift
    entitlements:
      path: apps/ios/messages/MerianMessagesExtension/Configuration/MerianMessagesExtension.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.merian.shared"]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.MessagesExtension
        INFOPLIST_FILE: apps/ios/messages/MerianMessagesExtension/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  MerianShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - apps/ios/share/MerianShareExtension
      - apps/ios/Merian/Configuration/MerianEnvironment.swift
      - apps/ios/Merian/Core/Utilities/ImageDownsampler.swift
      - apps/ios/Merian/Features/ShareImport/Shared
    entitlements:
      path: apps/ios/share/MerianShareExtension/Configuration/MerianShareExtension.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.merian.shared"]
        keychain-access-groups: ["$(AppIdentifierPrefix)app.merian.shared"]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.ShareExtension
        INFOPLIST_FILE: apps/ios/share/MerianShareExtension/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  merianTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.2"
    sources: [apps/ios/MerianTests]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

  merianUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.2"
    sources: [apps/ios/MerianUITests]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

schemes:
  Merian:
    build:
      targets:
        Merian: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - merianTests
        - merianUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
