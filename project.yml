name: Merian
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.3
    CURRENT_PROJECT_VERSION: 275
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    VERSIONING_SYSTEM: apple-generic
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Apple Distribution"

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.6"
  bundleIdPrefix: app.merian
  deploymentTarget:
    iOS: 17.2
    macOS: 14.0

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.64.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.47.0
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.41.1
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.1.0

targets:
  Merian:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: apps/ios/Merian
        excludes:
          - "**/*.md"
      - path: apps/ios/Shared/Branding
      - path: apps/ios/messages/ScanSharing/AppSupport
        excludes:
          - "**/*.md"
      - path: apps/ios/messages/ScanSharing/Shared
        excludes:
          - "**/*.md"
    entitlements:
      path: apps/ios/Merian/Configuration/Merian.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin: ["Default"]
        com.apple.security.application-groups: ["group.app.merian.shared"]
        keychain-access-groups: ["$(AppIdentifierPrefix)app.merian.shared"]
        com.apple.developer.weatherkit: true
        com.apple.developer.associated-domains: ["applinks:naturebook.earth", "applinks:merian.earth"]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        INFOPLIST_FILE: apps/ios/Merian/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Naturebook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        TARGETED_DEVICE_FAMILY: "1" # iPhone Only to bypass iPad Multitasking requirements
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: apps/ios/Merian/Configuration/Merian-Bridging-Header.h
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - target: MerianExploreWidget
        embed: true
      - target: MerianMessagesExtension
        embed: true
      - target: MerianWatch # Natively bundles the companion watchApp binary directly into the parent iPhone executable
        embed: true
      - package: RevenueCat
      - package: PostHog
      - package: Supabase
      - package: GoogleSignIn
    preBuildScripts:
      - name: Release Versioning Preflight
        basedOnDependencyAnalysis: false
        script: |
          bash "${SRCROOT}/scripts/check-ios-release-prep.sh"
    postBuildScripts:
      - name: Embed Build Provenance
        basedOnDependencyAnalysis: false
        script: |
          bash "${SRCROOT}/scripts/embed-ios-build-provenance.sh"
      - name: SwiftLint Validation
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed locally. Run 'brew install swiftlint' to enable automated static analysis."
          fi
  MerianWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - apps/watch/MerianWatch
      - apps/ios/Shared/Branding/PublicBrand.swift
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Naturebook
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.merian.Merian
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Naturebook uses the microphone when you record wildlife sounds."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Naturebook uses your location to add ecological context to recordings."
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleIconFiles: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  MerianExploreWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - apps/ios/widgets/Explore
      - apps/ios/Merian/Features/Explore/Widgets/ExploreWidgetCache.swift
      - apps/ios/Shared/Branding/PublicBrand.swift
    entitlements:
      path: apps/ios/widgets/Explore/Configuration/MerianExploreWidget.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.merian.shared"]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.ExploreWidget
        INFOPLIST_FILE: apps/ios/widgets/Explore/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  MerianMessagesExtension:
    type: app-extension.messages
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - apps/ios/messages/MerianMessagesExtension
      - apps/ios/messages/ScanSharing/Shared
      - apps/ios/Shared/Branding/PublicBrand.swift
    entitlements:
      path: apps/ios/messages/MerianMessagesExtension/Configuration/MerianMessagesExtension.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.merian.shared"]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.MessagesExtension
        INFOPLIST_FILE: apps/ios/messages/MerianMessagesExtension/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  merianTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.2"
    sources: [apps/ios/MerianTests]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

  merianUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.2"
    sources: [apps/ios/MerianUITests]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

schemes:
  Merian:
    build:
      targets:
        Merian: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: merianTests
          parallelizable: false
        - name: merianUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
