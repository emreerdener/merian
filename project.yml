name: Merian
configs:
  Debug: debug
  Release: release
  HistoryQualification: release
  HistoryTesting: release
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 275
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    VERSIONING_SYSTEM: apple-generic
    MERIAN_APP_GROUP_IDENTIFIER: group.app.merian.shared
    MERIAN_KEYCHAIN_NAMESPACE: app.merian.shared
    MERIAN_DEEP_LINK_SCHEME: naturebook
    MERIAN_LEGACY_DEEP_LINK_SCHEME: merian
  configs:
    HistoryTesting:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MERIAN_HISTORY_NORMAL_OAUTH MERIAN_HISTORY_LOCAL_DIAGNOSTICS"
      MERIAN_HISTORY_NORMAL_OAUTH: "1"
      MERIAN_AUTH_NAMESPACE: ""
      MERIAN_HISTORY_QUALIFICATION: "0"
    HistoryQualification:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MERIAN_HISTORY_QUALIFICATION"
options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "27.0"
  bundleIdPrefix: app.merian
  deploymentTarget:
    iOS: 17.2
    macOS: 14.0

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.83.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.69.0
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.54.1
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.2.0

targets:
  Merian:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: apps/ios/Merian
        excludes:
          - "**/*.md"
      - path: apps/ios/Shared/Branding
      - path: apps/ios/messages/ScanSharing/AppSupport
        excludes:
          - "**/*.md"
      - path: apps/ios/messages/ScanSharing/Shared
        excludes:
          - "**/*.md"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
      HistoryTesting: Config.xcconfig
      HistoryQualification: HistoryQualification.xcconfig
    settings:
      base:
        # Explicit plist inputs allow distinct entitlements per configuration.
        CODE_SIGN_ENTITLEMENTS: apps/ios/Merian/Configuration/Merian.entitlements
        INFOPLIST_FILE: apps/ios/Merian/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Naturebook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        TARGETED_DEVICE_FAMILY: "1" # iPhone Only to bypass iPad Multitasking requirements
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: apps/ios/Merian/Configuration/Merian-Bridging-Header.h
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MERIAN_HISTORY_NORMAL_OAUTH"
          MERIAN_HISTORY_NORMAL_OAUTH: "1"
          MERIAN_AUTH_NAMESPACE: ""
          MERIAN_HISTORY_QUALIFICATION: "0"
        HistoryTesting:
          APS_ENVIRONMENT: development
        HistoryQualification:
          APS_ENVIRONMENT: development
          PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian
          INFOPLIST_KEY_CFBundleDisplayName: Naturebook
          CODE_SIGN_ENTITLEMENTS: apps/ios/Merian/Configuration/Merian.entitlements
    dependencies:
      - target: MerianExploreWidget
        embed: true
      - target: MerianMessagesExtension
        embed: true
      - target: MerianWatch # Natively bundles the companion watchApp binary directly into the parent iPhone executable
        embed: true
      - package: RevenueCat
      - package: PostHog
      - package: Supabase
      - package: GoogleSignIn
    preBuildScripts:
      - name: Release Versioning Preflight
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          bash "${SRCROOT}/scripts/check-ios-release-prep.sh"
    postBuildScripts:
      - name: Embed Build Provenance
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          bash "${SRCROOT}/scripts/embed-ios-build-provenance.sh"
      - name: SwiftLint Validation
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if which swiftlint >/dev/null; then
            swiftlint lint --strict --no-cache
          else
            echo "warning: SwiftLint not installed locally. Run 'brew install swiftlint' to enable automated static analysis."
          fi
  MerianWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - apps/watch/MerianWatch
      - apps/ios/Shared/Branding/PublicBrand.swift
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
      HistoryTesting: Signing.xcconfig
      HistoryQualification: Signing.xcconfig
    settings:
      base:
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Naturebook
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.merian.Merian
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Naturebook uses the microphone when you record wildlife sounds."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Naturebook uses your location to add ecological context to recordings."
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleIconFiles: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        HistoryQualification:
          PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.watchkitapp
          INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.merian.Merian

  MerianExploreWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - apps/ios/widgets/Explore
      - apps/ios/Merian/Features/Explore/Widgets/ExploreWidgetCache.swift
      - apps/ios/Shared/Branding/PublicBrand.swift
    entitlements:
      path: apps/ios/widgets/Explore/Configuration/MerianExploreWidget.entitlements
      properties:
        com.apple.security.application-groups: ["$(MERIAN_APP_GROUP_IDENTIFIER)"]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
      HistoryTesting: Config.xcconfig
      HistoryQualification: HistoryQualification.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.ExploreWidget
        INFOPLIST_FILE: apps/ios/widgets/Explore/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        HistoryQualification:
          PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.ExploreWidget

  MerianMessagesExtension:
    type: app-extension.messages
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - apps/ios/messages/MerianMessagesExtension
      - apps/ios/messages/ScanSharing/Shared
      - apps/ios/Shared/Branding/PublicBrand.swift
    entitlements:
      path: apps/ios/messages/MerianMessagesExtension/Configuration/MerianMessagesExtension.entitlements
      properties:
        com.apple.security.application-groups: ["$(MERIAN_APP_GROUP_IDENTIFIER)"]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
      HistoryTesting: Config.xcconfig
      HistoryQualification: HistoryQualification.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.MessagesExtension
        INFOPLIST_FILE: apps/ios/messages/MerianMessagesExtension/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
      configs:
        HistoryQualification:
          PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.MessagesExtension

  merianTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: apps/ios/MerianTests
      - path: apps/ios/TestSupport
      - path: services/supabase/functions/check-scan-status/fixtures/observation-v1.json
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
      HistoryTesting: Signing.xcconfig
      HistoryQualification: Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

  merianPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: apps/ios/MerianPerformanceTests
      - path: apps/ios/TestSupport
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
      HistoryTesting: Signing.xcconfig
      HistoryQualification: Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

  merianUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: apps/ios/MerianUITests
      - path: apps/ios/TestSupport/InitialCompletionFixtures.json
      - path: services/supabase/functions/_shared/analysisHistory/fixtures/state-v1.json
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
      HistoryTesting: Signing.xcconfig
      HistoryQualification: Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

schemes:
  # Primary OAuth and live History routes; local testing, never distribution.
  HistoryTesting:
    build:
      targets:
        Merian: all
    run:
      config: HistoryTesting
    profile:
      config: HistoryTesting
    analyze:
      config: HistoryTesting
    archive:
      config: HistoryTesting

  # Inactive qualification preparation. Missing approval inputs fail before clients.
  HistoryQualification:
    build:
      targets:
        Merian: all
    run:
      config: HistoryQualification
    profile:
      config: HistoryQualification
    analyze:
      config: HistoryQualification
    archive:
      config: HistoryQualification

  Merian:
    build:
      targets:
        Merian: all
    run:
      config: Debug
      environmentVariables:
        MERIAN_ALLOW_PRODUCTION_SUPABASE_IN_DEBUG_SIMULATOR: "1"
    test:
      config: Debug
      targets:
        - name: merianTests
          parallelizable: false
        - name: merianPerformanceTests
          parallelizable: false
        - name: merianUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Guided synthetic device review; no live history installation or rollout.
  Merian Device - History:
    build:
      targets:
        Merian: all
    profile:
      config: Debug
    run:
      config: Debug
      environmentVariables:
        UITesting: "true"
        UITestKeychainNamespace: "1ff84ac9-a5e4-5ee5-a349-9ccf4af7d546"
      commandLineArguments:
        "-skipOnboarding": true
        "-seedCurrentRequiredConsent": true
        "-seedLocationPermissionPromptSuppressed": true
        "-mockCameraFeed": true
        "-hasCompletedOnboarding YES": true
        "-seedPrivateScanMapFlow": true
        "-seedIdentificationHistory": true

  # Guided synthetic device review; no live history installation or rollout.
  Merian Device - Community Photos:
    build:
      targets:
        Merian: all
    profile:
      config: Debug
