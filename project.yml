name: Merian
settings:
  base:
    DEVELOPMENT_TEAM: LDL96V2WT5
    CODE_SIGN_STYLE: Automatic

options:
  bundleIdPrefix: app.merian
  developmentTeam: "LDL96V2WT5"
  deploymentTarget:
    iOS: 17.2
    macOS: 14.0

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.64.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.47.0
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.41.1
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftClient.git
    from: 2.9.4
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios.git
    from: 6.16.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.1.0

targets:
  Merian:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources: [Merian]
    entitlements:
      path: Merian/Configuration/Merian.entitlements
      properties:
        com.apple.developer.applesignin: ["Default"]
        com.apple.developer.weatherkit: true
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Merian/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1" # iPhone Only to bypass iPad Multitasking requirements
        DEVELOPMENT_TEAM: LDL96V2WT5
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: MerianWatch # Natively bundles the companion watchApp binary directly into the parent iPhone executable
        embed: true
      - package: RevenueCat
      - package: PostHog
      - package: Supabase
      - product: TelemetryClient
        package: TelemetryDeck
      - package: RiveRuntime
      - package: GoogleSignIn
    postBuildScripts:
      - name: SwiftLint Validation
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed locally. Run 'brew install swiftlint' to enable automated static analysis."
          fi

  MerianWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [MerianWatch]
    settings:
      base:
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        PRODUCT_BUNDLE_IDENTIFIER: app.merian.Merian.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.merian.Merian
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleIconFiles: AppIcon
        DEVELOPMENT_TEAM: LDL96V2WT5
        CODE_SIGN_STYLE: Automatic

  merianTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.2"
    sources: [merianTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: LDL96V2WT5
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

  merianUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.2"
    sources: [merianUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: LDL96V2WT5
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Merian

schemes:
  Merian:
    build:
      targets:
        Merian: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - merianTests
        - merianUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
