[functions.merge-ghost-profile]
enabled = true
# Both phases require a user JWT (anonymous for prepare, permanent for
# complete). The gateway validates legacy and asymmetric signing-key JWTs;
# `withEdgeHandler` then resolves the live Auth user, and the transaction RPCs
# independently bind authority with `auth.uid()`.
verify_jwt = true
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/merge-ghost-profile/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
