# INTENTIONAL: verify_jwt = true — DwC-A export is a personal data download that requires
# a verified authenticated user session. Anonymous users cannot export their data because
# they have no stable identity to bind the export to.
verify_jwt = true
# Uncomment to specify a custom file path to the entrypoint.
