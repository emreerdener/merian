<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="density" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="0" y2="1000">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".05" stop-color="white" stop-opacity=".04"/>
      <stop offset=".11" stop-color="white" stop-opacity=".35"/>
      <stop offset=".18" stop-color="white" stop-opacity=".85"/>
      <stop offset=".25" stop-color="white"/>
      <stop offset=".69" stop-color="white"/>
      <stop offset=".79" stop-color="white" stop-opacity=".85"/>
      <stop offset=".88" stop-color="white" stop-opacity=".38"/>
      <stop offset=".96" stop-color="white" stop-opacity=".04"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="feather" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="1600" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".0037 .0021" numOctaves="3" seed="73" result="variation"/>
      <feDisplacementMap in="SourceGraphic" in2="variation" scale="155" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- A softly varying opacity field spans the width without a wavy outline. -->
  <rect x="-300" y="-300" width="1600" height="1600" fill="url(#density)" filter="url(#feather)"/>
</svg>
