<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="left" gradientUnits="userSpaceOnUse" x1="0" x2="1000" y1="0" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".07" stop-color="white" stop-opacity="0"/>
      <stop offset=".12" stop-color="white" stop-opacity=".06"/>
      <stop offset=".17" stop-color="white" stop-opacity=".32"/>
      <stop offset=".225" stop-color="white" stop-opacity=".72"/>
      <stop offset=".29" stop-color="white" stop-opacity=".97"/>
      <stop offset=".35" stop-color="white"/>
    </linearGradient>
    <linearGradient id="bottom" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="0" y2="1000">
      <stop offset=".68" stop-color="white"/>
      <stop offset=".78" stop-color="white" stop-opacity=".98"/>
      <stop offset=".86" stop-color="white" stop-opacity=".80"/>
      <stop offset=".92" stop-color="white" stop-opacity=".40"/>
      <stop offset=".97" stop-color="white" stop-opacity=".08"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="vertical" maskUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="1600" style="mask-type:alpha">
      <rect x="-300" y="-300" width="1600" height="1600" fill="url(#bottom)"/>
    </mask>
    <filter id="feather" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="1600" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".0023 .0041" numOctaves="3" seed="41" result="density"/>
      <feDisplacementMap in="SourceGraphic" in2="density" scale="170" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <!-- Distort a broad continuous opacity field, not a cutout silhouette.
       Static low-frequency variation avoids repeating waves or animated noise. -->
  <g filter="url(#feather)">
    <rect x="-300" y="-300" width="1600" height="1600" fill="url(#left)" mask="url(#vertical)"/>
  </g>
</svg>
